<title>아이디어 정원 프로토타입</title>
<meta name="description" content="불편했던 순간을 씨앗으로 심고 정원 신선의 질문으로 기획서까지 키우는 앱의 베타 프로토타입">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 데스크톱은 왼쪽 안내 패널 + 오른쪽 휴대폰 프레임, 휴대폰에서는 앱이 화면 전체 */
:root {
  --dew: #f3f6ef;        /* 배경: 아침 온실 */
  --paper: #fbfcf8;      /* 카드·시트 */
  --soil: #2b2a22;       /* 글자 */
  --soil-soft: #5c5a4c;
  --soil-faint: #8a8875;
  --line: #d3dac6;
  --leaf: #3f6b3a;       /* 주요 행동 */
  --leaf-deep: #2c4f2a;
  --on-leaf: #fbfcf8;
  --sprout: #cfe3b5;
  --sprout-soft: #e6f0d8;
  --bloom: #7b5ea7;      /* 꽃에만 쓰는 도라지색 */
  --bloom-soft: #ece5f5;
  --danger: #a3261e;
  --danger-soft: #f8e4e1;
  --grass-0: #e4e9dc; --grass-1: #c3dba5; --grass-2: #86b366; --grass-3: #4f8a3f;
  --frame: #c9d1bc;
  --stage-bg: #e3e9da;
  --shadow: 0 24px 60px -28px rgba(44, 79, 42, .45);
  --vase: rgba(160, 190, 200, .35);
  --vase-line: rgba(90, 120, 130, .55);

  --font-display: "Gowun Batang", "AppleMyungjo", "Noto Serif KR", serif;
  --font-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --r-field: 12px;
  --r-sheet: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --dew: #151a13; --paper: #1d231a; --soil: #e9ecdf; --soil-soft: #b5baa6; --soil-faint: #878d78;
    --line: #353d2f; --leaf: #7fb26a; --leaf-deep: #a6d08f; --on-leaf: #10150e; --sprout: #3b5233; --sprout-soft: #243020;
    --bloom: #b49be0; --bloom-soft: #2d2540; --danger: #ef8b80; --danger-soft: #3a1f1c;
    --grass-0: #262d22; --grass-1: #3a5a2e; --grass-2: #55873f; --grass-3: #86c065;
    --frame: #2c3427; --stage-bg: #0f130d; --shadow: 0 24px 60px -28px rgba(0,0,0,.8);
    --vase: rgba(140, 180, 190, .18); --vase-line: rgba(160, 200, 210, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --dew: #151a13; --paper: #1d231a; --soil: #e9ecdf; --soil-soft: #b5baa6; --soil-faint: #878d78;
  --line: #353d2f; --leaf: #7fb26a; --leaf-deep: #a6d08f; --on-leaf: #10150e; --sprout: #3b5233; --sprout-soft: #243020;
  --bloom: #b49be0; --bloom-soft: #2d2540; --danger: #ef8b80; --danger-soft: #3a1f1c;
  --grass-0: #262d22; --grass-1: #3a5a2e; --grass-2: #55873f; --grass-3: #86c065;
  --frame: #2c3427; --stage-bg: #0f130d; --shadow: 0 24px 60px -28px rgba(0,0,0,.8);
  --vase: rgba(140, 180, 190, .18); --vase-line: rgba(160, 200, 210, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--stage-bg); color: var(--soil);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.display { font-family: var(--font-display); font-weight: 400; }

/* ---------- 무대 ---------- */
.stage { height: 100%; display: flex; }
.guide { display: none; }
.app {
  position: relative; display: flex; flex-direction: column; overflow: hidden;
  width: 100%; height: 100%; background: var(--dew);
}
@media (min-width: 900px) {
  .stage {
    justify-content: center; align-items: center; gap: 56px;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .guide { display: flex; flex-direction: column; gap: 22px; width: 340px; max-height: 100%; overflow: auto; padding-block: 8px; }
  .app {
    width: 390px; height: min(820px, 100%); flex: none;
    border-radius: 40px; border: 9px solid var(--frame); box-shadow: var(--shadow);
  }
  .strip .guide-btn { display: none; }
}

/* ---------- 안내 패널 ---------- */
.guide h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.3; }
.guide .lede { color: var(--soil-soft); font-size: 15px; }
.guide h2 { font-size: 13px; font-weight: 600; color: var(--soil-soft); letter-spacing: .02em; }
.guide ol, .guide ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.guide ol { counter-reset: step; }
.guide .jump {
  width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
  padding: 10px 12px; border: 1px solid transparent; border-radius: 12px; background: transparent;
}
.guide .jump:hover { background: var(--paper); border-color: var(--line); }
.guide ol .jump::before {
  counter-increment: step; content: counter(step);
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sprout-soft); color: var(--leaf-deep); font-size: 12px; font-weight: 600; margin-top: 1px;
}
.guide ul .jump { grid-template-columns: 1fr; }
.jump b { display: block; font-weight: 500; font-size: 15px; }
.jump span { display: block; font-size: 13px; color: var(--soil-soft); line-height: 1.5; }
.guide .foot { font-size: 13px; color: var(--soil-faint); display: flex; flex-direction: column; gap: 8px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--leaf-deep); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

/* ---------- 앱 크롬 ---------- */
.strip {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 18px; font-size: 12px; color: var(--soil-faint); border-bottom: 1px dashed var(--line);
}
.strip .guide-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--soil-soft); }
.view { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
.view-inner { padding: 18px 18px 28px; display: flex; flex-direction: column; gap: 20px; }
.nav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--paper); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { min-height: 62px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--soil-soft); }
.nav button[aria-current="page"] { color: var(--leaf-deep); font-weight: 600; }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.topbar .left { display: flex; align-items: center; gap: 4px; min-width: 0; }
.topbar h1 { font-family: var(--font-display); font-size: 22px; line-height: 1.25; }
.back { width: 38px; height: 38px; margin-left: -10px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--soil-soft); }
.back:hover { background: var(--sprout-soft); }
.back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.points-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.points-chip i { width: 14px; height: 14px; border-radius: 50%; background: #d9b44a; box-shadow: inset 0 0 0 2px #b8902a; }

/* ---------- 공통 요소 ---------- */
.btn { min-height: 48px; padding: 0 18px; border-radius: var(--r-field); border: 1px solid transparent; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--leaf); color: var(--on-leaf); }
.btn.primary:hover { background: var(--leaf-deep); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--leaf-deep); }
.btn.quiet:hover { background: var(--sprout-soft); }
.btn.bloom { background: var(--bloom); color: var(--paper); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; white-space: nowrap; flex: none; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.full { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--soil-soft); }
.faint { color: var(--soil-faint); font-size: 13px; }
.sec-title { font-size: 15px; font-weight: 600; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-title small { font-weight: 400; font-size: 13px; color: var(--soil-soft); }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-sheet); padding: 18px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 11px; border-radius: 999px; font-size: 13px; background: var(--sprout-soft); color: var(--leaf-deep); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--soil-soft); }
.chip.bloom { background: var(--bloom-soft); color: var(--bloom); }
.chip.warn { background: var(--danger-soft); color: var(--danger); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-size: 14px; font-weight: 500; }
.field .hint { font-size: 13px; color: var(--soil-soft); }
.input, .textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-field); padding: 0 14px; font-size: 16px; }
.input { height: 48px; }
.textarea { padding: 12px 14px; min-height: 96px; resize: vertical; line-height: 1.6; }
.input:focus, .textarea:focus { border-color: var(--leaf); outline: none; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-toggle { min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; }
.tag-toggle[aria-pressed="true"], .tag-toggle:has(input:checked) { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
label.tag-toggle { position: relative; cursor: pointer; }
label.tag-toggle input { position: absolute; opacity: 0; pointer-events: none; }
label.tag-toggle:has(input:focus-visible) { outline: 2px solid var(--leaf); outline-offset: 2px; }
.notice { border-radius: var(--r-field); padding: 12px 14px; font-size: 14px; background: var(--sprout-soft); color: var(--leaf-deep); }
.notice.bloom { background: var(--bloom-soft); color: var(--bloom); }
.empty { text-align: center; padding: 28px 12px; color: var(--soil-soft); }
.divider { height: 1px; background: var(--line); }

/* ---------- 랜딩 ---------- */
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--leaf-deep); }
.wordmark svg { width: 20px; height: 20px; }
.hero h1 { font-family: var(--font-display); font-size: 32px; line-height: 1.3; letter-spacing: -.01em; }
.hero p { margin-top: 12px; color: var(--soil-soft); max-width: 32ch; }
.stage-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.stage-names { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; text-align: center; }
.stage-names b { display: block; font-size: 13px; font-weight: 500; }
.stage-names span { display: block; font-size: 11px; line-height: 1.4; color: var(--soil-soft); }
@keyframes grow-in { from { transform: translateY(6px) scaleY(.55); opacity: .25; } to { transform: none; opacity: 1; } }
.grow-in { transform-origin: bottom center; animation: grow-in 650ms cubic-bezier(.2,.7,.2,1) both; }

/* ---------- 정원 ---------- */
.goal { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.goal-ring { width: 64px; height: 64px; }
.goal-ring text { font-size: 15px; font-weight: 600; fill: var(--soil); font-family: var(--font-sans); }
.grass { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(12px, 1fr); grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 2px; }
.grass i { width: 100%; aspect-ratio: 1; min-width: 12px; border-radius: 3px; background: var(--grass-0); }
.grass i[data-l="1"] { background: var(--grass-1); }
.grass i[data-l="2"] { background: var(--grass-2); }
.grass i[data-l="3"] { background: var(--grass-3); }
.grass i[data-future] { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.grass i[data-today] { outline: 2px solid var(--leaf); outline-offset: 1px; }
.grass-wrap { display: grid; grid-template-columns: auto 1fr; gap: 6px; }
.grass-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; font-size: 10px; color: var(--soil-faint); line-height: 1; align-items: center; }
.week-marks { display: grid; grid-auto-flow: column; gap: 3px; margin-left: 18px; }
.week-marks span { height: 4px; border-radius: 2px; background: transparent; }
.week-marks span[data-done] { background: var(--leaf); }
.legend { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--soil-faint); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.beds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.pot-card { border: 1px solid var(--line); background: var(--paper); border-radius: 18px; padding: 10px 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pot-card:hover { border-color: var(--leaf); }
.pot-card svg { width: 100%; height: 118px; }
.pot-card .t { font-weight: 600; font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pot-card .s { font-size: 12px; color: var(--soil-soft); display: flex; justify-content: space-between; gap: 6px; }
.pot-card.new { border-style: dashed; align-items: center; justify-content: center; color: var(--leaf-deep); min-height: 200px; gap: 10px; }
.pot-card.new .plus { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--sprout-soft); font-size: 24px; }

/* ---------- 씨앗 상세 ---------- */
.idea-hero { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: end; }
.idea-hero svg { width: 112px; height: 140px; }
.idea-hero h1 { font-family: var(--font-display); font-size: 23px; line-height: 1.35; }
.meta { font-size: 12px; color: var(--soil-faint); font-variant-numeric: tabular-nums; }
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.track div { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--soil-faint); text-align: center; }
.track div::before { content: ""; height: 6px; border-radius: 3px; background: var(--grass-0); }
.track div[data-on]::before { background: var(--leaf); }
.track div[data-now] { color: var(--leaf-deep); font-weight: 600; }
.track div[data-now]::before { background: repeating-linear-gradient(90deg, var(--leaf) 0 6px, var(--sprout) 6px 10px); }
.track div[data-bloom][data-on]::before { background: var(--bloom); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 4px; font-size: 14px; color: var(--soil-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--leaf-deep); border-color: var(--leaf); font-weight: 600; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checklist li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; margin-top: 1px; }
.check[data-ok] { background: var(--leaf); border-color: var(--leaf); }
.check svg { width: 12px; height: 12px; fill: none; stroke: var(--on-leaf); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.checklist b { font-weight: 500; display: block; }
.checklist p { font-size: 13px; color: var(--soil-soft); }
.quota { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--soil-soft); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); }
.dots i[data-used] { background: var(--grass-0); }
.log { display: flex; flex-direction: column; gap: 12px; }
.log-entry { border-left: 3px solid var(--sprout); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 8px; }
.log-entry h3 { font-size: 14px; font-weight: 600; }
.log-entry dl { margin: 0; display: grid; gap: 6px; }
.log-entry dt { font-size: 12px; color: var(--soil-faint); }
.log-entry dd { margin: 0; font-size: 14px; }
.log-entry ul { margin: 0; padding-left: 18px; }

/* ---------- 정원 신선 대화 ---------- */
.chat-view { display: flex; flex-direction: column; height: 100%; }
.chat-head { flex: none; padding: 12px 18px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--dew); }
.chat-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.chat-foot { flex: none; border-top: 1px solid var(--line); background: var(--paper); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.6; white-space: pre-line; }
.msg.sage { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg.sage .who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--leaf-deep); font-weight: 600; margin-bottom: 4px; }
.msg.sage .who svg { width: 16px; height: 16px; }
.msg.sage .q { font-family: var(--font-display); font-size: 16.5px; line-height: 1.55; color: var(--soil); display: block; margin-top: 4px; }
.msg.me { align-self: flex-end; background: var(--leaf); color: var(--on-leaf); border-top-right-radius: 4px; }
.msg.note { align-self: center; background: none; color: var(--soil-faint); font-size: 12px; padding: 0; text-align: center; max-width: 100%; }
.judge { align-self: stretch; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.judge h3 { font-size: 14px; font-weight: 600; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.composer textarea { min-height: 46px; max-height: 120px; padding: 11px 14px; resize: none; }
.send { width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--leaf); color: var(--on-leaf); display: grid; place-items: center; }
.send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.foot-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 12px 14px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--soil-faint); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ---------- 기획서 ---------- */
.plan { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 0 var(--line), 0 6px 0 -3px var(--paper), 0 6px 0 -2px var(--line); }
.plan header { border-bottom: 1px solid var(--line); padding-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
.plan header h1 { font-family: var(--font-display); font-size: 22px; line-height: 1.35; }
.plan h2 { font-size: 13px; font-weight: 600; color: var(--leaf-deep); margin-bottom: 6px; }
.plan [contenteditable] { font-size: 14.5px; line-height: 1.75; white-space: pre-line; border-radius: 6px; padding: 2px 4px; margin: 0 -4px; }
.plan [contenteditable]:hover { background: var(--sprout-soft); }
.plan [contenteditable]:focus { outline: 2px solid var(--leaf); background: transparent; }

/* ---------- 공개 정원 · 꽃꽂이 ---------- */

    </div>

};

function msgHtml(m, i) {
  if (m.role === "me") return `<div class="msg me">${esc(m.text)}</div>`;
  if (m.role === "note") return `<div class="msg note">${esc(m.text)}</div>`;
  if (m.role === "typing") return `<div class="typing" aria-label="신선이 생각 중"><i></i><i></i><i></i></div>`;
  if (m.role === "judge") {
    const ok = m.results.every((x) => x.ok);
    return `<div class="judge"><h3>${STAGES[m.to - 1].name} 단계 판정</h3>
      <ul class="checklist">${m.results.map((x) => `<li><span class="check" ${x.ok ? "data-ok" : ""}>${x.ok ? CHECK : ""}</span><div><b>${esc(x.label)}</b><p>${x.ok ? "충분해요" : "아직 비어 있어요"}</p></div></li>`).join("")}</ul>
      ${ok && i.stage + 1 === m.to ? `<button class="btn ${m.to === 5 ? "bloom" : "primary"} full" data-action="stageUp" data-id="${i.id}">${STAGES[m.to - 1].name}${m.to === 5 ? "을 피우기" : "으로 키우기"}</button>` : ok ? `<p class="faint">이미 이 단계로 자랐어요.</p>` : ""}</div>`;
  }
  return `<div class="msg sage"><span class="who">${SAGE_ICON}정원 신선</span>${m.pre ? esc(m.pre) : ""}${m.q ? `<span class="q">${esc(m.q)}</span>` : ""}${m.after ? `<span style="display:block;margin-top:6px">${esc(m.after)}</span>` : ""}</div>`;
}

function bouquet(items) {
  const flowers = items.filter((x) => x.stage >= 4).sort((a, b) => (b.likes + (S.liked[b.id] ? 1 : 0)) - (a.likes + (S.liked[a.id] ? 1 : 0))).slice(0, 7);
  if (!flowers.length) return `<div class="bouquet"><div class="empty">아직 꽃이 핀 아이디어가 없어요.</div></div>`;
  const W = 340, cx = 170, base = 196;
  const n = flowers.length;
  // 공감이 많은 꽃일수록 가운데에 꽂습니다
  const slots = Array.from({ length: n }, (_, k) => (n === 1 ? 0 : k / (n - 1) - 0.5)).sort((a, b) => Math.abs(a) - Math.abs(b) || a - b);
  const placed = flowers.map((f, idx) => {
    const t = slots[idx];
    const ang = t * 104 * (Math.PI / 180);
    const len = 128 + (1 - Math.abs(t) * 2) * 34 + (idx % 2) * 6;
    const x = cx + Math.sin(ang) * len, y = base - Math.cos(ang) * len;
    return { f, x, y, ang, idx };
  });
  const stems = placed.map((p) => `<path d="M${cx} ${base} Q ${cx + (p.x - cx) * 0.35} ${base - 70} ${p.x.toFixed(1)} ${(p.y + 6).toFixed(1)}" stroke="#3f6b3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>` + leaf(cx + (p.x - cx) * 0.3, base - 58, (p.ang * 180) / Math.PI - (p.x > cx ? 70 : 110), 0.62, "#5c8a4f")).join("");
  const heads = placed.map((p) => {
    const c = FLOWER_HUES[p.f.category] || "#7b5ea7";
    const isNew = S.justArranged === p.f.id;
    const head = p.f.stage === 5 ? `<g class="petals">${flowerShape(c, 0.86)}</g>` : `<g class="petals" transform="translate(0 10)">${budShape(c)}</g>`;
    return `<g class="flower ${isNew ? "arrange-new" : ""}" tabindex="0" role="button" aria-label="${esc(p.f.title)}" data-action="openFeed" data-id="${p.f.id}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${((p.ang * 180) / Math.PI * 0.4).toFixed(1)})"><circle class="ring" r="24" fill="transparent" stroke="transparent"/>${head}</g>`;
  }).join("");
  const vase = `<path d="M${cx - 34} ${base - 14} C ${cx - 40} ${base + 10}, ${cx - 30} ${base + 28}, ${cx - 22} ${base + 32} L ${cx + 22} ${base + 32} C ${cx + 30} ${base + 28}, ${cx + 40} ${base + 10}, ${cx + 34} ${base - 14} Z" fill="var(--vase)" stroke="var(--vase-line)" stroke-width="1.5"/><ellipse cx="${cx}" cy="${base - 14}" rx="34" ry="5" fill="none" stroke="var(--vase-line)" stroke-width="1.5"/><path d="M${cx - 28} ${base + 4} Q ${cx} ${base + 10} ${cx + 28} ${base + 4}" stroke="var(--vase-line)" stroke-width="1" fill="none" opacity=".6"/>`;
  return `<section class="bouquet" aria-label="이번 주 꽃꽂이">
    <div class="row" style="justify-content:space-between"><b class="display" style="font-size:17px">이번 주 꽃꽂이</b><span class="faint">공감이 많은 꽃과 봉오리</span></div>
    <svg viewBox="0 0 ${W} 232" role="group" aria-label="공감 많은 아이디어 꽃다발">${stems}${vase}${heads}</svg>
    <div class="bq-legend">${flowers.map((f) => `<button data-action="openFeed" data-id="${f.id}"><i style="background:${FLOWER_HUES[f.category]}"></i>${esc(snip(f.title, 14))}</button>`).join("")}</div>
  </section>`;
}

/* ---------- 정원 계산 ---------- */
function weekCount() {
  const ws = weekStart(now());
  let n = 0;
  for (let d = 0; d < 7; d++) if (S.activity[dkey(ws + d * DAY)]) n++;
  return n;
}
function grass() {
  const weeks = 12;
  const ws = weekStart(now());
  const start = ws - (weeks - 1) * 7 * DAY;
  let cells = "", marks = "";
  for (let w = 0; w < weeks; w++) {
    let days = 0;
    for (let d = 0; d < 7; d++) {
      const t = start + (w * 7 + d) * DAY;
      const k = dkey(t);
      const future = t > startOfDay(now());
      const v = S.activity[k] || 0;
      if (v) days++;
      cells += `<i ${future ? "data-future" : `data-l="${Math.min(3, v)}"`} ${k === dkey(now()) ? "data-today" : ""} title="${fmtDate(t)} ${v ? `${v}회` : "활동 없음"}"></i>`;
    }
    marks += `<span ${days >= S.settings.weeklyTarget ? "data-done" : ""}></span>`;
  }
  return `<div class="stack" style="gap:6px">
    <div class="grass-wrap"><div class="grass-days" aria-hidden="true"><span>월</span><span></span><span>수</span><span></span><span>금</span><span></span><span>일</span></div>
    <div class="grass" role="img" aria-label="최근 12주 정원 가꾸기 기록">${cells}</div></div>
    <div class="week-marks" style="grid-template-columns:repeat(${weeks},1fr)" aria-hidden="true">${marks}</div>
    <div class="row" style="justify-content:space-between"><span class="faint" style="font-size:11px">초록 막대 = 목표를 채운 주</span><span class="legend">적음 <i style="background:var(--grass-1)"></i><i style="background:var(--grass-2)"></i><i style="background:var(--grass-3)"></i> 많음</span></div>
  </div>`;
}
function markActivity() {
  const k = dkey(now());
  S.activity[k] = (S.activity[k] || 0) + 1;
  const ws = weekStart(now());
  if (weekCount() >= S.settings.weeklyTarget && !S.goalAwarded[ws]) {
    S.goalAwarded[ws] = true;
    addTx(S.settings.weeklyGoal, "주간 목표 달성");
    setTimeout(() => toast(`이번 주 목표를 채웠어요. +${S.settings.weeklyGoal}P`), 600);
  }
}
const lastTouched = (i) => Math.max(i.createdAt, ...i.log.map((e) => e.at), ...(i.chat.length ? [i.chat[i.chat.length - 1].at || 0] : [0]));

/* ---------- 정원 신선 엔진 (각본) ---------- */
function ensureChatStarted(i) {
  if (i.chat.length && i.session) return;
  i.session = { newKeys: [], startedAt: now() };
  const ru = RUBRIC[i.stage + 1];
  if (!ru) { if (!i.chat.length) i.chat.push({ role: "sage", pre: "꽃이 피었어요. 이제 기획서로 정리할 차례예요.", at: now() }); return; }
  const first = ru.items.find((it) => !i.answers[it.k]);
  i.chat.push({ role: "note", text: `${fmtDateTime(now())} · ${STAGES[i.stage - 1].name} 단계`, at: now() });
  if (i.pending && !i.pending.unpaid) {
    const it = ru.items.find((x) => x.k === i.pending.k);
    if (it && !i.answers[it.k]) { i.chat.push({ role: "sage", pre: "지난번 질문부터 이어 갈게요.\n", q: it.q, at: now() }); save(); return; }
    i.pending = null;
  }
  if (!first) { i.chat.push({ role: "sage", pre: `${ru.title}에 필요한 이야기는 모두 모였어요.`, after: "위의 '다음 단계로'를 눌러 단계 판정을 받아 보세요.", at: now() }); save(); return; }
  const opener = (i.log.length ? OPEN[1] : OPEN[0]).replace("%s", ru.title);
  askItem(i, first, opener);
  save();
}
function credit(i) { if (i.freeLeft > 0) { i.freeLeft--; return true; } if (i.paidLeft > 0) { i.paidLeft--; return true; } return false; }
function askItem(i, it, pre) {
  if (!credit(i)) {
    i.pending = { k: it.k, followed: false, unpaid: true };
    i.chat.push({ role: "note", text: "이 단계의 무료 질문을 모두 썼어요.", at: now() });
    setTimeout(() => openPay(i), 300);
    return;
  }
  i.pending = { k: it.k, followed: false };
  i.chat.push({ role: "sage", pre: pre ? pre + "\n" : "", q: it.q, at: now() });
}
function nextUnanswered(i) { const ru = RUBRIC[i.stage + 1]; return ru ? ru.items.find((it) => !i.answers[it.k]) : null; }
function onAnswer(i, text) {
  i.chat.push({ role: "me", text, at: now() });
  const ru = RUBRIC[i.stage + 1];
  const it = i.pending && ru ? ru.items.find((x) => x.k === i.pending.k) : null;
  if (!it) { i.chat.push({ role: "sage", pre: "말씀 고마워요.", after: "필요한 질문은 다 드렸어요. '다음 단계로'로 판정을 받아 보시겠어요?", at: now() }); return; }
  const vague = text.trim().length < 14 || VAGUE.test(text);
  if (vague && !i.pending.followed) {
    if (!credit(i)) { i.answers[it.k] = text.trim(); i.session.newKeys.push(it.k); i.pending = null; i.chat.push({ role: "note", text: "무료 질문을 다 써서 이 답을 그대로 적어 둘게요.", at: now() }); setTimeout(() => openPay(i), 300); return; }
    i.pending.followed = true;
    i.chat.push({ role: "sage", pre: "", q: it.f, at: now() });
    return;
  }
  i.answers[it.k] = text.trim();
  if (!i.session.newKeys.includes(it.k)) i.session.newKeys.push(it.k);
  i.pending = null;
  const ack = ACK[Math.floor(Math.random() * ACK.length)].replace("%s", snip(text, 20));
  const nx = nextUnanswered(i);
  if (nx) askItem(i, nx, ack);
  else i.chat.push({ role: "sage", pre: ack, after: `${ru.title}에 필요한 이야기가 모두 모였어요. 단계 판정을 해 볼까요?`, at: now() }), judge(i);
}
function judge(i) {
  const to = i.stage + 1; const ru = RUBRIC[to]; if (!ru) return;
  const results = ru.items.map((it) => ({ label: it.label, ok: !!i.answers[it.k] }));
  i.chat.push({ role: "judge", to, results, at: now() });
  const miss = results.filter((x) => !x.ok);
  if (miss.length) {
    const nx = nextUnanswered(i);
    const pre = `아직 ${miss.map((m) => `'${m.label}'`).join(", ")}이(가) 비어 있어요. 이것부터 이야기해 볼까요?`;
    if (nx && (!i.pending || i.pending.k !== nx.k)) askItem(i, nx, pre);
    else i.chat.push({ role: "sage", pre, after: "위 질문에 답해 주시면 돼요.", at: now() });
  }
}
function stageUp(i) {
  const from = i.stage;
  i.stage++;
  i.freeLeft = S.settings.freePerStage; i.paidLeft = 0; i.pending = null;
  addTx(S.settings.stageUp, `단계 상승 · ${i.title} ${STAGES[i.stage - 1].name}`);
  finishSession(i, true);
  i.chat.push({ role: "note", text: `${STAGES[i.stage - 1].name} 단계가 됐어요 · +${S.settings.stageUp}P`, at: now() });
  if (i.stage < 5) { i.session = { newKeys: [], startedAt: now() }; const nx = nextUnanswered(i); askItem(i, nx, `이제 '${RUBRIC[i.stage + 1].title}'를 다룰 차례예요.`); }
  else i.chat.push({ role: "sage", pre: "꽃이 피었어요. 여기까지 오는 아이디어는 많지 않아요.", after: "이제 기획서로 정리하고, 원하면 공유해서 함께할 사람을 찾아보세요.", at: now() });
  save();
  celebrate(from, i);
}
function finishSession(i, silent) {
  if (!i.session) return null;
  const ru = RUBRIC[i.stage + (silent ? 0 : 1)] || RUBRIC[i.stage];
  const keys = i.session.newKeys;
  const items = Object.values(RUBRIC).flatMap((r) => r.items);
  const entry = {
    at: now(), stage: silent ? i.stage - 1 : i.stage,
    conclusions: keys.map((k) => { const it = items.find((x) => x.k === k); return [it.label, snip(i.answers[k], 48)]; }),
    organized: keys.length,
    open: silent ? [] : (RUBRIC[i.stage + 1]?.items.filter((it) => !i.answers[it.k]).map((it) => it.label) || []),
  };
  const touched = keys.length || i.chat.some((m) => m.role === "me" && m.at >= i.session.startedAt);
  i.session = null;
  if (!touched) return null;
  i.log.push(entry);
  markActivity();
  return entry;
}

function makePlan(i) {

  return [
    { h: "문제 정의", b: `${L(a.who)}이(가)\n${L(a.when)}\n이 순간 겪는 불편: ${L(a.pain)}` },
    { h: "타깃 사용자", b: `처음 쓸 사람: ${L(a.target)}\n지금의 대안: ${L(a.alt)}` },
    { h: "해결책과 핵심 기능", b: `${L(a.solution)}\n핵심 기능: ${L(a.features)}` },
    { h: "차별점", b: `기존 대안의 한계: ${L(a.gap)}\n우리가 다른 점: ${L(a.diff)}` },
    { h: "검증 계획", b: `${L(a.validate)}\n성공 기준: ${L(a.metric)}` },
    { h: "비즈니스 모델", b: L(a.bm) },
    { h: "필요한 팀 역량", b: `${team}\n현재 팀: ${[S.user.name, ...i.team.map((p) => person(p).name)].join(", ")}` },
  ];
}
function planMarkdown(i) { return `# ${i.title}\n\n> ${S.user.name} · ${S.user.uni} · 처음 심은 날 ${fmtDateTime(i.createdAt)}\n\n` + i.plan.map((s) => `## ${s.h}\n\n${s.b}`).join("\n\n") + "\n"; }
function sageSummaryDraft(i) { const a = i.answers; if (a.solution) return snip(`${a.target ? snip(a.target, 18) + "을 위한 " : ""}${a.solution}`, 110); if (a.pain) return snip(`${a.who ? snip(a.who, 20) + "의 " : ""}불편: ${a.pain}`, 110); return snip(i.body, 110); }

function mineAsFeed() {
  return S.ideas.filter((i) => i.visibility !== "private" && i.published !== false && (i.published || i.id === "class" || i.id === "share")).map((i) => ({ id: i.id, title: i.title, summary: i.summary || sageSummaryDraft(i), author: S.user.name, uni: S.user.uni, community: true, stage: i.stage, category: i.category, likes: i.likes, createdAt: i.createdAt, seeking: i.seeking, funding: i.funding, mine: true, vis: i.visibility }));
}
const allFeed = () => [...mineAsFeed(), ...S.feed];
function feedItems() { return allFeed().filter((x) => S.feedTab === "all" || x.community); }
function sameCommunity(p) { return p.uni === S.user.uni || p.clubs.some((c) => S.user.clubs.includes(c)); }
function recommend(i) {
  return S.people.filter((p) => !i.team.includes(p.id)).map((p) => ({ p, s: p.skills.filter((s) => i.seeking.includes(s)).length * 2 + (sameCommunity(p) ? 1 : 0) })).filter((x) => x.s >= 2).sort((a, b) => b.s - a.s).map((x) => x.p);
}

const app = $("#app");
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; app.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
function sheet(html) {
  closeSheet();
  const s = document.createElement("div"); s.className = "scrim"; s.dataset.scrim = "1";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div>`;
  app.appendChild(s);
  const f = s.querySelector("input, textarea, button.btn"); if (f) setTimeout(() => f.focus(), 50);
}
function closeSheet() { document.querySelectorAll(".scrim").forEach((x) => x.remove()); }

    <p class="muted" style="max-width:28ch">${i.stage === 5 ? "이제 기획서를 만들 수 있어요." : `다음은 '${RUBRIC[i.stage + 1].title}'예요. 무료 질문 ${S.settings.freePerStage}개가 새로 생겼어요.`}</p>

const FORMS = {

    const msg = !name ? "이름을 입력해 주세요." : !m ? "베타 참여 대학의 학교 이메일로만 가입할 수 있어요. 예: you@hanbit.test" : pw.length < 8 ? "비밀번호는 8자 이상으로 정해 주세요." : "";
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    S.user = { ...S.user, name, email, uni: m.name, clubs: [] };
    S.draft.signup = { name, email };
    go("verify");
  },
  plant: (f) => {
    const title = f.title.value.trim(); const body = f.body.value.trim();
    if (!title) { toast("제목을 적어 주세요."); f.title.focus(); return; }
    const cat = (f.querySelector('input[name="cat"]:checked') || {}).value || "campus";
    const i = { id: uid(), title, body: body || "아직 자세한 내용은 없어요. 신선과 이야기하며 채워 가요.", stage: 1, createdAt: now(), visibility: "private", category: cat, answers: {}, freeLeft: S.settings.freePerStage, paidLeft: 0, chat: [], log: [], seeking: [], summary: "", team: [], funding: null, plan: null, likes: 0 };
    S.ideas.push(i); markActivity(); save(); closeSheet();
    go("seed", { id: i.id }); toast("씨앗을 심었어요. 심은 시각이 기록됐어요.");
  },
  chat: (f) => {
    const i = idea(f.dataset.id); const text = f.msg.value.trim(); if (!text) return;
    if (i.pending && i.pending.unpaid) { openPay(i); return; }
    S.draft["chat-" + i.id] = "";
    f.msg.value = "";
    i.chat.push({ role: "me", text, at: now() });
    i.chat.push({ role: "typing", at: now() });
    render();
    setTimeout(() => {
      i.chat = i.chat.filter((m) => m.role !== "typing");
      i.chat.pop(); // onAnswer 가 다시 넣음
      onAnswer(i, text); save(); render();
    }, 700);
  },
  req: (f) => {
    const id = f.dataset.id, kind = f.dataset.kind;
    S.sentRequests[id] = { ...(S.sentRequests[id] || {}), [kind]: "pending" };
    save(); closeSheet(); render(); toast(kind === "team" ? "팀 참여 신청을 보냈어요." : "열람 요청을 보냈어요.");

};
function guideBody() {
  const step = (j, b, s) => `<li><button class="jump" data-action="jump" data-j="${j}"><span><b>${b}</b><span>${s}</span></span></button></li>`;
  const item = (j, b, s) => `<li><button class="jump" data-action="jump" data-j="${j}"><span><b>${b}</b><span>${s}</span></span></button></li>`;
  return `
    <section><h2>핵심 루프 따라가기</h2><ol>
      ${step("start", "가입", "학교 이메일로 대학 커뮤니티 자동 소속")}
      ${step("plant", "씨앗 심기", "제목과 불편했던 점, 30초 입력")}
      ${step("chat", "정원 신선과 대화", "한 번에 질문 하나. '예시 답변 넣기'로 빠르게")}
      ${step("stage", "단계 판정과 성장", "빠진 항목이 없으면 다음 단계로 자람")}
      ${step("bloom", "개화 직전 씨앗", "꽃봉오리 → 검증·비즈니스 모델")}
      ${step("plan", "기획서", "성장 일지로 자동 생성, 바로 편집")}
      ${step("share", "꽃꽂이로 공유", "공개 범위, 요약, 찾는 역량, 팀 추천")}
    </ol></section>
    <section><h2>다른 화면</h2><ul>
      ${item("feed", "공개 정원", "이번 주 꽃꽂이, 커뮤니티·전체, 공감")}
      ${item("other", "다른 사람 아이디어", "요약만 공개, 열람 요청, 팀 참여 신청, 펀딩 응원")}
      ${item("requests", "받은 신청", "수락하면 팀 결성 포인트")}
      ${item("points", "포인트와 테스트 충전", "모든 획득·사용 내역")}
      ${item("admin", "관리자", "베타 지표, 포인트 수치 조정")}
    </ul></section>`;
}
function renderGuide() {
  $("#guide").innerHTML = `
    <div class="stack" style="gap:10px">${WORDMARK}<h1>아이디어 정원<br>베타 프로토타입</h1>
    <p class="lede">불편했던 순간을 씨앗으로 심고, 정원 신선의 질문에 답하며 기획서까지 키우는 앱이에요. 서버 없이 화면 흐름만 보여 주며, 정원 신선의 질문은 미리 짜 둔 각본입니다.</p></div>
    ${guideBody()}
    <div class="foot"><span>사용한 내용은 이 브라우저에만 저장돼요.</span><button class="link-btn" data-action="reset" style="align-self:flex-start">예시 데이터로 처음부터</button></div>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", (ev) => {
  const scrim = ev.target.closest("[data-scrim]");
  if (scrim && ev.target === scrim) { closeSheet(); return; }
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const fn = A[el.dataset.action];
  if (!fn) return;
  if (el.closest(".sheet") && el.dataset.action === "jump") closeSheet();
  ev.preventDefault();
  fn({ ...el.dataset }, ev);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { closeSheet(); document.querySelectorAll(".celebrate").forEach((c) => c.remove()); }
  const el = ev.target.closest && ev.target.closest('[role="button"][data-action]');
  if (el && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); el.click(); }
  if (ev.target.id === "chat-input" && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); ev.target.form.requestSubmit(); }
});
document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("[data-form]"); if (!f) return;
  ev.preventDefault(); FORMS[f.dataset.form](f);
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.live === "signupEmail") {
    S.draft.signup = { ...(S.draft.signup || {}), email: t.value };
    const m = matchUni(t.value); const typed = t.value.includes("@") && (t.value.split("@")[1] || "").includes(".");
    const h = $("#su-email-hint");
    h.textContent = typed ? (m ? `${m.name} 커뮤니티에 자동으로 소속돼요.` : "베타 참여 대학의 학교 이메일만 가입할 수 있어요.") : "예: you@hanbit.test, you@saesol.test";
    h.style.color = typed ? (m ? "var(--leaf-deep)" : "var(--danger)") : "";
  }
  if (t.dataset.live === "onbCode") { (S.draft.onb ||= { interests: [], skills: [] }).code = t.value; }
  if (t.dataset.live === "summary") { const i = idea(t.dataset.id); i.summary = t.value; save(); }
  if (t.id === "chat-input") { const i = idea(S.route.id); if (i) S.draft["chat-" + i.id] = t.value; t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; }
  if (t.dataset.plan) { const i = idea(t.dataset.plan); i.plan[+t.dataset.k].b = t.innerText; save(); }
  if (t.dataset.setting) { const v = Math.max(1, Math.min(999, parseInt(t.value || "0", 10) || 1)); S.settings[t.dataset.setting] = v; save(); }
});

render(true);
})();
</script>
