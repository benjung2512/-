<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ede0">
<title>아이디어 정원 풍선 버전</title>
<meta name="description" content="떠오른 생각을 풍선에 담고 정원 신선의 질문으로 키워 하늘로 띄우는 앱의 베타 프로토타입 (풍선 버전)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 데스크톱은 왼쪽 안내 패널 + 오른쪽 휴대폰 프레임, 휴대폰에서는 앱이 화면 전체 */
/*
  풍선 버전 디자인 토큰 · 60/30/10 규칙
  - 60% 메인: 크림 #F4EDE0 (배경·메모장·하늘 아래쪽). 다크 모드에서는 네이비가 60%를 맡아요.
  - 30% 보조: 네이비 #14213D (글자·기본 버튼·집·자라는 풍선). 다크 모드에서는 크림이 30%.
  - 10% 강조: 코랄 #FF6B5B (화면마다 핵심 행동 하나, 날 준비된 풍선, 새 소식 점). 위에 올리는 글자는 네이비.
  코랄은 크림 위 글자로 쓰면 대비가 부족해, 글자용으로는 짙은 코랄(--bloom)을 따로 둡니다.
  토큰 이름(leaf, bloom 등)은 원본과 같게 두고 값만 바꿨습니다.
*/
:root {
  --dew: #f4ede0;
  --paper: #fbf7ef;
  --soil: #14213d;
  --soil-soft: #3f4a66;
  --soil-faint: #5d667c;
  --line: #e0d5c1;
  --leaf: #14213d;
  --leaf-deep: #14213d;
  --on-leaf: #f4ede0;
  --sprout: #d8cdb7;
  --sprout-soft: #ebe2d1;
  --bloom: #b23a2c;
  --bloom-soft: #ffe1da;
  --accent: #ff6b5b;
  --on-accent: #14213d;
  --danger: #b42318;
  --danger-soft: #fde2de;
  --grass-0: #e6ddcb; --grass-1: #bcc4d6; --grass-2: #5a6890; --grass-3: #14213d;
  --frame: #d8cdb7;
  --stage-bg: #e9e1d2;
  --shadow: 0 24px 60px -28px rgba(20, 33, 61, .45);
  --card-shadow: 0 14px 30px -22px rgba(20, 33, 61, .55);
  --vase: rgba(160, 150, 130, .3);
  --vase-line: rgba(90, 85, 75, .5);
  --sky-1: #f4ede0; --sky-2: #f8e6da; --sky-3: #fcdcd0;
  --glow: #ff6b5b;
  --cloud: #fffbf5;
  --hill: #e6d9c2;
  --string: #8c93a6;
  --tag-bg: rgba(251, 247, 239, .95);
  --house-wall: #fbf7ef; --house-roof: #14213d; --house-window: #ffd9a8; --house-door: #ff6b5b; --house-line: #14213d;
  --push-bg: rgba(251, 247, 239, .92);
  /* 풍선: 단계가 오를수록 커지고 짙어져요. 5단계(비행)만 코랄 */
  --b1: #bcc4d6; --b2: #8e9ab7; --b3: #5a6890; --b4: #26345a; --b5: #ff6b5b; --b-down: #c9bfac;

  --font-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --r-field: 12px;
  --r-sheet: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --dew: #0e1830; --paper: #14213d; --soil: #f4ede0; --soil-soft: #cfc6b5; --soil-faint: #a39c8c;
    --line: #2a3758; --leaf: #f4ede0; --leaf-deep: #f4ede0; --on-leaf: #14213d; --sprout: #33406a; --sprout-soft: #1d2a4a;
    --bloom: #ff8f82; --bloom-soft: #3b2333; --accent: #ff6b5b; --on-accent: #14213d; --danger: #fca5a5; --danger-soft: #3b1515;
    --grass-0: #1d2a4a; --grass-1: #4a5778; --grass-2: #b3bacb; --grass-3: #f4ede0;
    --frame: #2a3758; --stage-bg: #080e1e; --shadow: 0 24px 60px -28px rgba(0,0,0,.8); --card-shadow: 0 14px 30px -22px rgba(0,0,0,.9);
    --vase: rgba(140, 150, 180, .18); --vase-line: rgba(170, 180, 210, .45);
    --sky-1: #0a1124; --sky-2: #14213d; --sky-3: #4b2c47; --glow: #ff6b5b;
    --cloud: #1f2c4d; --hill: #0b1428; --string: #6b7591; --tag-bg: rgba(20, 33, 61, .92);
    --house-wall: #ede5d6; --house-roof: #3a4a75; --house-window: #ffd9a8; --house-door: #ff6b5b; --house-line: #0a1124;
    --push-bg: rgba(29, 42, 74, .92);
    --b1: #4a5778; --b2: #7c88a6; --b3: #b3bacb; --b4: #ede5d6; --b5: #ff6b5b; --b-down: #4a4f5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --dew: #0e1830; --paper: #14213d; --soil: #f4ede0; --soil-soft: #cfc6b5; --soil-faint: #a39c8c;
  --line: #2a3758; --leaf: #f4ede0; --leaf-deep: #f4ede0; --on-leaf: #14213d; --sprout: #33406a; --sprout-soft: #1d2a4a;
  --bloom: #ff8f82; --bloom-soft: #3b2333; --accent: #ff6b5b; --on-accent: #14213d; --danger: #fca5a5; --danger-soft: #3b1515;
  --grass-0: #1d2a4a; --grass-1: #4a5778; --grass-2: #b3bacb; --grass-3: #f4ede0;
  --frame: #2a3758; --stage-bg: #080e1e; --shadow: 0 24px 60px -28px rgba(0,0,0,.8); --card-shadow: 0 14px 30px -22px rgba(0,0,0,.9);
  --vase: rgba(140, 150, 180, .18); --vase-line: rgba(170, 180, 210, .45);
  --sky-1: #0a1124; --sky-2: #14213d; --sky-3: #4b2c47; --glow: #ff6b5b;
  --cloud: #1f2c4d; --hill: #0b1428; --string: #6b7591; --tag-bg: rgba(20, 33, 61, .92);
  --house-wall: #ede5d6; --house-roof: #3a4a75; --house-window: #ffd9a8; --house-door: #ff6b5b; --house-line: #0a1124;
  --push-bg: rgba(29, 42, 74, .92);
  --b1: #4a5778; --b2: #7c88a6; --b3: #b3bacb; --b4: #ede5d6; --b5: #ff6b5b; --b-down: #4a4f5e;
  color-scheme: dark;
}


* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--stage-bg); color: var(--soil);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.display { font-family: var(--font-display); font-weight: 400; }

/* ---------- 무대 ---------- */
/* 휴대폰: 앱이 화면 전체 · 900px 이상: 가운데 휴대폰 프레임(#guide 면 안내 패널도) · 1024px 이상(안내 패널 없이): 왼쪽 기록 + 오른쪽 하늘·대화 */
.stage { height: 100%; display: flex; }
.guide { display: none; }
.app {
  position: relative; display: flex; flex-direction: column; overflow: hidden;
  width: 100%; height: 100%; background: var(--dew);
}
.panes { flex: 1; display: flex; min-height: 0; }
.pane.list { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane.detail { display: none; }
@media (min-width: 900px) {
  .stage {
    justify-content: center; align-items: center; gap: 56px;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body.with-guide .guide { display: flex; flex-direction: column; gap: 22px; width: 360px; max-height: 100%; overflow: auto; padding-block: 8px; }
  .app {
    width: 390px; height: min(820px, 100%); flex: none;
    border-radius: 40px; border: 9px solid var(--frame); box-shadow: var(--shadow);
  }
  .strip .guide-btn { display: none; }
}
@media (min-width: 1024px) {
  body:not(.with-guide) .stage { padding: 0; }
  body:not(.with-guide) .app { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  body:not(.with-guide) .app:not(.wide) .pane.list { max-width: 440px; margin-inline: auto; border-inline: 1px solid var(--line); }
}
body:not(.with-guide) .strip .guide-btn { display: none; }
.app.wide .panes { display: grid; grid-template-columns: minmax(360px, 440px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.app.wide .pane.list { border-right: 1px solid var(--line); }
.app.wide .pane.detail { display: block; }
.app.wide .pane.detail .view-inner { max-width: 720px; margin-inline: auto; padding: 24px 32px 48px; }
.app.wide .pane.detail .chat-view { max-width: 760px; margin-inline: auto; border-inline: 1px solid var(--line); background: var(--dew); }
.app.wide .scrim { align-items: center; justify-content: center; }
.app.wide .sheet { max-width: 480px; max-height: 84%; border-radius: 24px; padding-bottom: 24px; }
.app.wide .sheet .grab { display: none; }
.app.wide .toast { bottom: 28px; }


/* ---------- 안내 패널 ---------- */
.guide h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.3; }
.guide .lede { color: var(--soil-soft); font-size: 15px; }
.guide h2 { font-size: 13px; font-weight: 600; color: var(--soil-soft); letter-spacing: .02em; }
.guide ol, .guide ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.guide ol { counter-reset: step; }
.guide .jump {
  width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
  padding: 10px 12px; border: 1px solid transparent; border-radius: 12px; background: transparent;
}
.guide .jump:hover { background: var(--paper); border-color: var(--line); }
.guide ol .jump::before {
  counter-increment: step; content: counter(step);
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sprout-soft); color: var(--leaf-deep); font-size: 12px; font-weight: 600; margin-top: 1px;
}
.guide ul .jump { grid-template-columns: 1fr; }
.jump b { display: block; font-weight: 500; font-size: 15px; }
.jump span { display: block; font-size: 13px; color: var(--soil-soft); line-height: 1.5; }
.guide .foot { font-size: 13px; color: var(--soil-faint); display: flex; flex-direction: column; gap: 8px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--leaf-deep); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

/* ---------- 앱 크롬 ---------- */
.strip {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 18px; font-size: 12px; color: var(--soil-faint); border-bottom: 1px dashed var(--line);
}
.strip .guide-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--soil-soft); }
.view { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
.view-inner { padding: 18px 18px 28px; display: flex; flex-direction: column; gap: 20px; }
.nav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--paper); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { min-height: 62px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--soil-soft); }
.nav button[aria-current="page"] { color: var(--leaf-deep); font-weight: 600; }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.topbar .left { display: flex; align-items: center; gap: 4px; min-width: 0; }
.topbar h1 { font-family: var(--font-display); font-size: 22px; line-height: 1.25; }
.back { width: 38px; height: 38px; margin-left: -10px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--soil-soft); }
.back:hover { background: var(--sprout-soft); }
.back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.points-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.points-chip i { width: 14px; height: 14px; border-radius: 50%; background: #d9b44a; box-shadow: inset 0 0 0 2px #b8902a; }

/* ---------- 공통 요소 ---------- */
.btn { min-height: 48px; padding: 0 18px; border-radius: var(--r-field); border: 1px solid transparent; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--leaf); color: var(--on-leaf); }
.btn.primary:hover { background: var(--leaf-deep); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--leaf-deep); }
.btn.quiet:hover { background: var(--sprout-soft); }
.btn.bloom { background: var(--bloom); color: var(--paper); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; white-space: nowrap; flex: none; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.full { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--soil-soft); }
.faint { color: var(--soil-faint); font-size: 13px; }
.sec-title { font-size: 15px; font-weight: 600; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-title small { font-weight: 400; font-size: 13px; color: var(--soil-soft); }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-sheet); padding: 18px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 11px; border-radius: 999px; font-size: 13px; background: var(--sprout-soft); color: var(--leaf-deep); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--soil-soft); }
.chip.bloom { background: var(--bloom-soft); color: var(--bloom); }
.chip.warn { background: var(--danger-soft); color: var(--danger); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-size: 14px; font-weight: 500; }
.field .hint { font-size: 13px; color: var(--soil-soft); }
.input, .textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-field); padding: 0 14px; font-size: 16px; }
.input { height: 48px; }
.textarea { padding: 12px 14px; min-height: 96px; resize: vertical; line-height: 1.6; }
.input:focus, .textarea:focus { border-color: var(--leaf); outline: none; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-toggle { min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; }
.tag-toggle[aria-pressed="true"], .tag-toggle:has(input:checked) { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
label.tag-toggle { position: relative; cursor: pointer; }
label.tag-toggle input { position: absolute; opacity: 0; pointer-events: none; }
label.tag-toggle:has(input:focus-visible) { outline: 2px solid var(--leaf); outline-offset: 2px; }
.notice { border-radius: var(--r-field); padding: 12px 14px; font-size: 14px; background: var(--sprout-soft); color: var(--leaf-deep); }
.notice.bloom { background: var(--bloom-soft); color: var(--bloom); }
.empty { text-align: center; padding: 28px 12px; color: var(--soil-soft); }
.divider { height: 1px; background: var(--line); }

/* ---------- 랜딩 ---------- */
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--leaf-deep); }
.wordmark svg { width: 20px; height: 20px; }
.hero h1 { font-family: var(--font-display); font-size: 32px; line-height: 1.3; letter-spacing: -.01em; }
.hero p { margin-top: 12px; color: var(--soil-soft); max-width: 32ch; }
.stage-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.stage-names { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; text-align: center; }
.stage-names b { display: block; font-size: 13px; font-weight: 500; }
.stage-names span { display: block; font-size: 11px; line-height: 1.4; color: var(--soil-soft); }
@keyframes grow-in { from { transform: translateY(6px) scaleY(.55); opacity: .25; } to { transform: none; opacity: 1; } }
.grow-in { transform-origin: bottom center; animation: grow-in 650ms cubic-bezier(.2,.7,.2,1) both; }

/* ---------- 정원 ---------- */
.goal { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.goal-ring { width: 64px; height: 64px; }
.goal-ring text { font-size: 15px; font-weight: 600; fill: var(--soil); font-family: var(--font-sans); }
.grass { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(12px, 1fr); grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 2px; }
.grass i { width: 100%; aspect-ratio: 1; min-width: 12px; border-radius: 3px; background: var(--grass-0); }
.grass i[data-l="1"] { background: var(--grass-1); }
.grass i[data-l="2"] { background: var(--grass-2); }
.grass i[data-l="3"] { background: var(--grass-3); }
.grass i[data-future] { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.grass i[data-today] { outline: 2px solid var(--leaf); outline-offset: 1px; }
.grass-wrap { display: grid; grid-template-columns: auto 1fr; gap: 6px; }
.grass-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; font-size: 10px; color: var(--soil-faint); line-height: 1; align-items: center; }
.week-marks { display: grid; grid-auto-flow: column; gap: 3px; margin-left: 18px; }
.week-marks span { height: 4px; border-radius: 2px; background: transparent; }
.week-marks span[data-done] { background: var(--leaf); }
.legend { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--soil-faint); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.beds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.pot-card { border: 1px solid var(--line); background: var(--paper); border-radius: 18px; padding: 10px 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pot-card:hover { border-color: var(--leaf); }
.pot-card svg { width: 100%; height: 118px; }
.pot-card .t { font-weight: 600; font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pot-card .s { font-size: 12px; color: var(--soil-soft); display: flex; justify-content: space-between; gap: 6px; }
.pot-card.new { border-style: dashed; align-items: center; justify-content: center; color: var(--leaf-deep); min-height: 200px; gap: 10px; }
.pot-card.new .plus { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--sprout-soft); font-size: 24px; }

/* ---------- 씨앗 상세 ---------- */
.idea-hero { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: end; }
.idea-hero svg { width: 112px; height: 140px; }
.idea-hero h1 { font-family: var(--font-display); font-size: 23px; line-height: 1.35; }
.meta { font-size: 12px; color: var(--soil-faint); font-variant-numeric: tabular-nums; }
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.track div { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--soil-faint); text-align: center; }
.track div::before { content: ""; height: 6px; border-radius: 3px; background: var(--grass-0); }
.track div[data-on]::before { background: var(--leaf); }
.track div[data-now] { color: var(--leaf-deep); font-weight: 600; }
.track div[data-now]::before { background: repeating-linear-gradient(90deg, var(--leaf) 0 6px, var(--sprout) 6px 10px); }
.track div[data-bloom][data-on]::before { background: var(--bloom); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 4px; font-size: 14px; color: var(--soil-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--leaf-deep); border-color: var(--leaf); font-weight: 600; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checklist li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; margin-top: 1px; }
.check[data-ok] { background: var(--leaf); border-color: var(--leaf); }
.check svg { width: 12px; height: 12px; fill: none; stroke: var(--on-leaf); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.checklist b { font-weight: 500; display: block; }
.checklist p { font-size: 13px; color: var(--soil-soft); }
.quota { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--soil-soft); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); }
.dots i[data-used] { background: var(--grass-0); }
.log { display: flex; flex-direction: column; gap: 12px; }
.log-entry { border-left: 3px solid var(--sprout); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 8px; }
.log-entry h3 { font-size: 14px; font-weight: 600; }
.log-entry dl { margin: 0; display: grid; gap: 6px; }
.log-entry dt { font-size: 12px; color: var(--soil-faint); }
.log-entry dd { margin: 0; font-size: 14px; }
.log-entry ul { margin: 0; padding-left: 18px; }

/* ---------- 정원 신선 대화 ---------- */
.chat-view { display: flex; flex-direction: column; height: 100%; }
.chat-head { flex: none; padding: 12px 18px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--dew); }
.chat-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.chat-foot { flex: none; border-top: 1px solid var(--line); background: var(--paper); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.6; white-space: pre-line; }
.msg.sage { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg.sage .who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--leaf-deep); font-weight: 600; margin-bottom: 4px; }
.msg.sage .who svg { width: 16px; height: 16px; }
.msg.sage .q { font-family: var(--font-display); font-size: 16.5px; line-height: 1.55; color: var(--soil); display: block; margin-top: 4px; }
.msg.me { align-self: flex-end; background: var(--leaf); color: var(--on-leaf); border-top-right-radius: 4px; }
.msg.note { align-self: center; background: none; color: var(--soil-faint); font-size: 12px; padding: 0; text-align: center; max-width: 100%; }
.judge { align-self: stretch; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.judge h3 { font-size: 14px; font-weight: 600; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.composer textarea { min-height: 46px; max-height: 120px; padding: 11px 14px; resize: none; }
.send { width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--leaf); color: var(--on-leaf); display: grid; place-items: center; }
.send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.foot-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 12px 14px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--soil-faint); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ---------- 기획서 ---------- */
.plan { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 0 var(--line), 0 6px 0 -3px var(--paper), 0 6px 0 -2px var(--line); }
.plan header { border-bottom: 1px solid var(--line); padding-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
.plan header h1 { font-family: var(--font-display); font-size: 22px; line-height: 1.35; }
.plan h2 { font-size: 13px; font-weight: 600; color: var(--leaf-deep); margin-bottom: 6px; }
.plan [contenteditable] { font-size: 14.5px; line-height: 1.75; white-space: pre-line; border-radius: 6px; padding: 2px 4px; margin: 0 -4px; }
.plan [contenteditable]:hover { background: var(--sprout-soft); }
.plan [contenteditable]:focus { outline: 2px solid var(--leaf); background: transparent; }

/* ---------- 공개 정원 · 꽃꽂이 ---------- */
.bouquet { background: linear-gradient(180deg, var(--paper), var(--dew)); border: 1px solid var(--line); border-radius: var(--r-sheet); padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.bouquet svg { width: 100%; height: auto; display: block; }
.bouquet .flower { cursor: pointer; }
.bouquet .flower:hover .petals, .bouquet .flower:focus .petals { transform: scale(1.12); }
.bouquet .petals { transform-box: fill-box; transform-origin: center; transition: transform .2s; }
.bouquet .flower:focus { outline: none; }
.bouquet .flower:focus-visible circle.ring { stroke: var(--leaf); stroke-width: 2; }
.bq-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--soil-soft); }
.bq-legend button { border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--soil-soft); }
.bq-legend i { width: 9px; height: 9px; border-radius: 50%; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 36px; font-size: 14px; color: var(--soil-soft); }
.seg button[aria-pressed="true"] { background: var(--sprout-soft); color: var(--leaf-deep); font-weight: 600; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters button { flex: none; }
.feed-card { border: 1px solid var(--line); background: var(--paper); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 56px 1fr; gap: 12px; text-align: left; width: 100%; }
.feed-card:hover { border-color: var(--leaf); }
.feed-card svg { width: 56px; height: 70px; }
.feed-card h3 { font-size: 15.5px; font-weight: 600; line-height: 1.4; }
.feed-card p.sum { font-size: 14px; color: var(--soil-soft); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.feed-card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--soil-faint); }
.like { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--soil-soft); font-variant-numeric: tabular-nums; }
.like[aria-pressed="true"] { background: var(--bloom-soft); border-color: transparent; color: var(--bloom); }
.like svg { width: 14px; height: 14px; }
.bar { height: 8px; border-radius: 4px; background: var(--grass-0); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--bloom); border-radius: 4px; }
.lock { position: relative; border: 1px dashed var(--line); border-radius: 16px; padding: 16px; overflow: hidden; }
.lock .ghost { display: flex; flex-direction: column; gap: 8px; filter: blur(4px); opacity: .6; user-select: none; }
.lock .ghost i { height: 10px; border-radius: 5px; background: var(--soil-faint); display: block; }
.lock .over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 12px; background: color-mix(in srgb, var(--paper) 55%, transparent); }
.person { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--sprout-soft); color: var(--leaf-deep); font-weight: 600; font-family: var(--font-display); }
.person b { font-weight: 600; font-size: 15px; }
.person .tags { gap: 4px; margin-top: 4px; }
.person .chip { font-size: 12px; padding: 1px 8px; }
.chip.hit { background: var(--leaf); color: var(--on-leaf); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }

/* ---------- 내 정보 · 포인트 · 관리자 ---------- */
.kv { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 11px 0; align-items: center; font-size: 14px; }
.kv .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
.kv .amt.plus { color: var(--leaf-deep); }
.kv .amt.minus { color: var(--soil-soft); }
.balance { display: flex; align-items: baseline; gap: 6px; }
.balance b { font-size: 34px; font-family: var(--font-display); font-variant-numeric: tabular-nums; line-height: 1.1; }
.packs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pack { border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.pack[aria-pressed="true"] { border-color: var(--leaf); box-shadow: inset 0 0 0 1px var(--leaf); }
.pack b { font-size: 18px; font-variant-numeric: tabular-nums; }
.pack span { font-size: 13px; color: var(--soil-soft); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat span { font-size: 12px; color: var(--soil-soft); }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; }
.stat small { font-size: 12px; color: var(--leaf-deep); }
.hbar { display: grid; grid-template-columns: 64px 1fr 36px; gap: 8px; align-items: center; font-size: 13px; }
.hbar .track2 { height: 10px; background: var(--grass-0); border-radius: 5px; overflow: hidden; }
.hbar .track2 i { display: block; height: 100%; background: var(--leaf); border-radius: 5px; }
.hbar .track2 i.bloomy { background: var(--bloom); }
.hbar span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--soil-soft); }
.setting { display: grid; grid-template-columns: 1fr 92px; gap: 10px; align-items: center; padding: 8px 0; font-size: 14px; }
.setting input { height: 38px; text-align: right; padding: 0 10px; }

/* ---------- 시트 · 토스트 · 연출 ---------- */
.scrim { position: absolute; inset: 0; background: rgba(20, 26, 18, .38); z-index: 30; display: flex; align-items: flex-end; animation: fade .18s ease-out; }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--dew); border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; animation: rise .24s cubic-bezier(.2,.7,.2,1); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 2px; }
.sheet h2 { font-family: var(--font-display); font-size: 21px; line-height: 1.35; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(30px); opacity: .4; } }
.toast { position: absolute; left: 50%; bottom: 82px; transform: translateX(-50%); z-index: 50; background: var(--soil); color: var(--dew); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 36px); width: max-content; box-shadow: 0 8px 24px -12px rgba(0,0,0,.4); animation: rise .2s ease-out; }
.celebrate { position: absolute; inset: 0; z-index: 40; background: color-mix(in srgb, var(--dew) 94%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; animation: fade .2s; }
.celebrate .plant { width: 190px; height: 236px; position: relative; }
.celebrate .plant svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.celebrate .old { animation: out .5s .4s forwards; }
.celebrate .new { opacity: 0; transform-origin: bottom center; animation: grow-in .8s .7s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes out { to { opacity: 0; } }
.celebrate h2 { font-family: var(--font-display); font-size: 26px; }
.celebrate .gain { font-weight: 600; color: var(--leaf-deep); background: var(--sprout-soft); border-radius: 999px; padding: 4px 14px; font-size: 14px; }
.arrange-new { animation: drop-in 1s .2s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; }
@keyframes drop-in { from { transform: translateY(-60px); opacity: 0; } }

/* ---------- 헤더 · 알림 ---------- */
.hdr-right { display: flex; align-items: center; gap: 8px; flex: none; }
.me-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--sprout-soft); color: var(--leaf-deep); font-family: var(--font-display); font-weight: 700; display: grid; place-items: center; flex: none; }
.me-btn .dot { position: absolute; top: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: var(--bloom); box-shadow: 0 0 0 2px var(--dew); }
.notice-banner { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; border-radius: var(--r-field); padding: 12px 14px; background: var(--bloom-soft); color: var(--bloom); font-size: 14px; font-weight: 500; text-align: left; }
.notice-banner span { text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }

/* ---------- 랜딩 문구 ---------- */
.hero .quote { font-family: var(--font-display); font-size: 16px; color: var(--soil-soft); margin: 0 0 10px; }
.pitch { padding: 16px 18px; border-radius: 18px; background: var(--sprout-soft); color: var(--leaf-deep); display: flex; flex-direction: column; gap: 6px; }
.pitch b { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.45; }
.pitch p { font-size: 14px; color: var(--soil-soft); }

/* ---------- 빠른 기록 · 씨앗 주머니 ---------- */
.capture-box { display: flex; flex-direction: column; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 10px 14px; }
.capture-box:focus-within { border-color: var(--leaf); }
.capture-box textarea { width: 100%; border: 0; background: transparent; resize: none; font-size: 17px; line-height: 1.55; min-height: 54px; max-height: 160px; padding: 2px 0; outline: none; }
.capture-box textarea::placeholder { color: var(--soil-faint); }
.capture-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mic { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--dew); display: grid; place-items: center; color: var(--leaf-deep); flex: none; }
.mic:hover { background: var(--sprout-soft); }
.mic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.capture-note { font-size: 13px; color: var(--soil-faint); padding-left: 2px; }
.pouch { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.memo { width: 100%; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; text-align: left; border: 1px dashed var(--line); background: transparent; border-radius: 14px; padding: 10px 12px; }
.memo:hover { border-style: solid; border-color: var(--leaf); background: var(--paper); }
.memo svg { width: 18px; height: 18px; margin-top: 2px; fill: none; stroke: var(--soil-faint); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.memo .txt { font-size: 14.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.memo .when { font-size: 12px; color: var(--soil-faint); white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 2px; }

/* ---------- 홈 카드 ---------- */
.recall { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 6px 10px 12px; border-radius: 18px; background: var(--bloom-soft); }
.recall svg { width: 48px; height: 60px; }
.recall p { font-size: 14px; line-height: 1.5; }
.recall .link-btn { color: var(--bloom); font-size: 13px; margin-top: 2px; }
.x-btn { width: 36px; height: 36px; border: 0; background: none; color: var(--soil-faint); border-radius: 50%; font-size: 20px; line-height: 1; }
.x-btn:hover { background: var(--paper); }
.reco { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 8px 12px 8px 8px; }
.reco svg { width: 50px; height: 64px; }
.reco b { font-weight: 600; display: block; line-height: 1.4; }
.mini-list { display: flex; flex-direction: column; gap: 8px; }
.mini { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 16px; padding: 8px 12px 8px 8px; }
.mini svg { width: 40px; height: 52px; }
.mini b { font-weight: 600; font-size: 14.5px; display: block; line-height: 1.4; }
.mini:hover, .reco:hover { border-color: var(--leaf); }
details.goal-panel > summary { list-style: none; cursor: pointer; }
details.goal-panel > summary::-webkit-details-marker { display: none; }
details.goal-panel[open] > summary { margin-bottom: 14px; }
details.goal-panel .goal { grid-template-columns: auto minmax(0, 1fr) auto; }
.chev { width: 20px; height: 20px; fill: none; stroke: var(--soil-faint); stroke-width: 2; stroke-linecap: round; transition: transform .2s; }
details[open] .chev { transform: rotate(180deg); }

/* ---------- 커뮤니티 ---------- */
.presence { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 14px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); }
.faces { display: flex; }
.faces span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--leaf-deep); background: var(--sprout-soft); box-shadow: 0 0 0 2px var(--paper); font-family: var(--font-display); }
.faces span + span { margin-left: -8px; }
.faces span:nth-child(2n) { background: var(--bloom-soft); color: var(--bloom); }
.presence b { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.presence b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--grass-3); }
.ticker { font-size: 13px; color: var(--soil-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .35s; }
.ticker.swap { opacity: 0; }
.tabs .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bloom); color: var(--paper); font-size: 11px; font-weight: 600; vertical-align: 1px; }
.team-card { border: 1px solid var(--line); background: var(--paper); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.team-card h3 { font-size: 15.5px; font-weight: 600; line-height: 1.4; }

/* ---------- 첨삭 ---------- */
.clist { display: flex; flex-direction: column; }
.clist > * + * { border-top: 1px solid var(--line); }
.comment { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; }
.c-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.c-head b { font-size: 14px; font-weight: 600; }
.avatar.sm { width: 28px; height: 28px; font-size: 13px; }
.comment p { font-size: 14.5px; }
.chip.sm { font-size: 12px; padding: 0 8px; }
.c-on { border: 0; background: none; padding: 0; text-align: left; font-size: 12.5px; color: var(--leaf-deep); text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.comment-form textarea { min-height: 92px; }

/* ---------- 발전 과정 타임라인 ---------- */
.timeline { list-style: none; margin: 0; padding: 2px 0 6px; display: flex; overflow-x: auto; scrollbar-width: none; }
.timeline::-webkit-scrollbar { display: none; }
.timeline li { flex: none; display: flex; flex-direction: column; gap: 3px; min-width: 78px; padding-right: 12px; position: relative; font-size: 12px; }
.timeline li::before { content: ""; position: absolute; top: 5px; left: 14px; right: 0; height: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline i { width: 12px; height: 12px; border-radius: 50%; background: var(--soil-faint); position: relative; z-index: 1; }
.timeline [data-k="plant"] i { background: #9a7552; }
.timeline [data-k="talk"] i { background: var(--leaf); }
.timeline [data-k="comment"] i { background: var(--bloom); }
.timeline [data-k="stage"] i { background: var(--grass-3); outline: 2px solid var(--grass-1); outline-offset: 1px; }
.timeline [data-k="rest"] i { background: var(--line); }
.timeline b { font-weight: 500; color: var(--soil); white-space: nowrap; }
.timeline span { color: var(--soil-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- 아카이브 ---------- */
.arch { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
.arch .dormant { width: 60px; height: 76px; opacity: .6; filter: grayscale(.9) sepia(.2); }
.arch-open { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }

.arch .why { font-size: 13.5px; color: var(--soil-soft); margin-top: 4px; }

/* ---------- 음성 기록 ---------- */
.rec { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 4px; }
.wave { display: flex; align-items: center; gap: 4px; height: 52px; }
.wave i { width: 5px; height: 100%; border-radius: 3px; background: var(--leaf); transform: scaleY(.25); animation: wave 1s ease-in-out infinite; }

/* ---------- 내 정보 스위치 ---------- */

.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }

/* ---------- 안내 패널 비교표 ---------- */
.cmp { overflow-x: auto; margin-top: 8px; }
.cmp table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; }

.cmp th { font-weight: 600; font-size: 12px; color: var(--soil-soft); }
.cmp td:first-child { font-weight: 500; width: 40%; }
.cmp-us { margin-top: 10px; font-size: 13.5px; color: var(--leaf-deep); background: var(--sprout-soft); padding: 10px 12px; border-radius: 12px; }
.guide .plain-list { list-style: disc; padding-left: 18px; gap: 4px; font-size: 13.5px; color: var(--soil-soft); }

/* ---------- 시듦 · 꽃잎 연출 ---------- */
.celebrate.wither .plant .foliage { transform-box: fill-box; transform-origin: 50% 100%; animation: wither 1.7s .35s cubic-bezier(.5, 0, .75, 0) forwards; }
@keyframes wither { 0% { transform: none; opacity: 1; } 35% { transform: rotate(-9deg) scaleY(.92); opacity: .9; } 100% { transform: rotate(-4deg) scaleY(.02); opacity: 0; } }
.dust { position: absolute; left: 50%; top: 66%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #7a5a3a; opacity: 0; animation: dust 1.1s forwards; }
@keyframes dust { 0% { opacity: 0; transform: none; } 25% { opacity: .85; } 100% { opacity: 0; transform: translate(var(--dx), -38px); } }
.celebrate .later { opacity: 0; animation: fade-in .4s forwards; }
@keyframes fade-in { to { opacity: 1; } }
.petal-rain { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.petal-rain span { position: absolute; top: -24px; width: 11px; height: 15px; border-radius: 70% 0 70% 0; background: var(--c); opacity: .9; animation: fall var(--d) var(--w) cubic-bezier(.3, .2, .6, 1) forwards; }
@keyframes fall { to { transform: translate(var(--x), 900px) rotate(600deg); opacity: .5; } }

/* ---------- 화면 배경 ---------- */
.view[data-screen="write"] { background: var(--paper); }
.view[data-screen="sky"], .view[data-screen="feed"] { background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 58%, var(--sky-3) 100%); background-attachment: local; }

/* ---------- 기록 화면 ---------- */
.write { min-height: 100%; display: flex; flex-direction: column; gap: 14px; padding: 18px 18px 10px; }
.write-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
.write-date { font-family: var(--font-display); font-size: 20px; }
.pad { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 280px; }
.pad-label { font-size: 13px; font-weight: 500; color: var(--soil-soft); transition: color .2s; }
.pad:focus-within .pad-label { color: var(--leaf-deep); }
.pad textarea {
  flex: 1; width: 100%; min-height: 200px; border: 0; padding: 0; resize: none; outline: none;
  font-size: 19px; line-height: 1.7; color: var(--soil); background-color: transparent;
  background-image: repeating-linear-gradient(transparent 0 calc(1.7em - 1px), var(--line) calc(1.7em - 1px) 1.7em);
  background-attachment: local;
}
.pad textarea::placeholder { color: var(--soil-faint); }
.pad:focus-within .pad-line { transform: scaleX(1); }
.pad-line { height: 2px; background: var(--leaf); transform: scaleX(0); transform-origin: left; transition: transform .25s; }
.pad-actions { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.pad-actions .faint { line-height: 1.45; }
.mic { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--dew); display: grid; place-items: center; color: var(--leaf-deep); flex: none; }
.mic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mic.big { width: 64px; height: 64px; border: 0; background: var(--leaf); color: var(--on-leaf); box-shadow: 0 8px 18px -10px var(--leaf); }
.mic.big svg { width: 28px; height: 28px; }
.mic:active { transform: scale(.95); }
.saved { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--sprout-soft); }
.saved svg { width: 36px; height: 54px; }
.saved p { font-size: 14px; line-height: 1.5; }
.saved b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.write-meta { font-size: 13px; color: var(--soil-faint); font-variant-numeric: tabular-nums; }
.handle { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; color: var(--leaf-deep); font-weight: 600; font-size: 15px; min-height: 56px; padding: 4px 28px; border-radius: 16px; }
.handle:hover { background: var(--sprout-soft); }
.handle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.handle small { font-weight: 400; font-size: 12px; color: var(--soil-faint); }

/* ---------- 하늘 화면 ---------- */
.sky-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.to-write { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 10px 0 6px; margin-left: -6px; border: 0; background: none; border-radius: 12px; color: var(--leaf-deep); font-weight: 600; font-size: 14px; }
.to-write svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.to-write:hover { background: var(--tag-bg); }
.week { display: flex; align-items: center; gap: 8px; }
.week ol { display: flex; gap: 3px; list-style: none; margin: 0; padding: 0; }
.week li { width: 18px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--soil-soft); }
.week li i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--soil-faint); }
.week li[data-on] i { background: var(--leaf); border-color: var(--leaf); }
.week li[data-today] { color: var(--soil); font-weight: 700; }
.week b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.house-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; color: var(--leaf-deep); flex: none; }
.house-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.house-btn .dot, .me-btn .dot { position: absolute; top: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: var(--bloom); box-shadow: 0 0 0 2px var(--paper); }
.scene { position: relative; width: 100%; max-width: 440px; margin: 0 auto; aspect-ratio: 360 / 420; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.b-btn { position: absolute; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; border-radius: 50%; }
.b-btn svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 6px rgba(15, 23, 42, .14)); transition: transform .15s ease-out; }
.b-btn:active svg { transform: scale(.94); }
.b-btn:focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; }
.b-tag { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); white-space: nowrap; font-family: var(--font-display); font-size: 12.5px; line-height: 1; padding: 5px 8px; border-radius: 999px; background: var(--tag-bg); color: var(--soil); box-shadow: 0 1px 3px rgba(15, 23, 42, .15); pointer-events: none; }
.b-btn[data-stage="5"] .b-tag { background: var(--bloom); color: var(--paper); }
.b-btn.grew svg { animation: inflate .9s cubic-bezier(.3, 1.4, .5, 1) .25s both; }
@keyframes inflate { from { transform: scale(.7); } 60% { transform: scale(1.08); } to { transform: none; } }
.b-btn.pop-in { animation: float-in 1.1s cubic-bezier(.2, .8, .2, 1) .2s both; }
@keyframes float-in { from { transform: translateY(150px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.ground-btn { position: absolute; left: 50%; bottom: 1.5%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--tag-bg); color: var(--soil-soft); font-size: 12.5px; white-space: nowrap; box-shadow: 0 1px 3px rgba(15, 23, 42, .12); }
.ground-btn:hover { color: var(--soil); }
.more-note { position: absolute; right: 2%; top: 2%; font-size: 12px; color: var(--soil-soft); background: var(--tag-bg); border-radius: 999px; padding: 3px 9px; }
.sky-hint { text-align: center; font-size: 13px; color: var(--soil-soft); }
.b-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.b-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.b-row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 16px; padding: 6px 12px; min-height: 56px; }
.b-row:hover { border-color: var(--leaf); }
.b-row svg { width: 30px; height: 45px; }
.b-row b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 16px; line-height: 1.3; }
.b-row .faint { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; color: var(--soil-soft); flex: none; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.label-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--sprout-soft); color: var(--leaf-deep); font-family: var(--font-display); font-size: 15px; }
.label-pill.flying { background: var(--bloom-soft); color: var(--bloom); }

/* ---------- 메뉴 ---------- */
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-item { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 10px 14px; min-height: 64px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
.menu-item:hover { border-color: var(--leaf); }
.menu-item .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--sprout-soft); color: var(--leaf-deep); }
.menu-item .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.menu-item b { display: block; font-weight: 600; }
.menu-item span.faint { display: block; }

/* ---------- 알림 설정 ---------- */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.stepper button { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--leaf-deep); }
.stepper button:disabled { color: var(--soil-faint); opacity: .5; }
.stepper b { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.days .tag-toggle { padding: 0; justify-content: center; min-height: 44px; }
.push { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 20px; background: var(--push-bg); box-shadow: 0 10px 28px -14px rgba(15, 23, 42, .45); border: 1px solid var(--line); }
.push .app-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--leaf); display: grid; place-items: center; }
.push .app-ic svg { width: 22px; height: 30px; }
.push-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--soil-soft); }
.push p { font-size: 14.5px; line-height: 1.5; }
.preview-wrap { padding: 18px 14px; border-radius: 22px; background: linear-gradient(180deg, var(--sky-1), var(--sky-3)); }

/* ---------- 대화 입력 (음성 포함) ---------- */
.composer.with-mic { grid-template-columns: auto minmax(0, 1fr) auto; }
.composer .mic { width: 46px; height: 46px; border-radius: 12px; }

/* ---------- 화면 전환 ---------- */
.enter-up { animation: enter-up .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter-up { from { transform: translateY(48px); opacity: .2; } }
.enter-down { animation: enter-down .4s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter-down { from { transform: translateY(-48px); opacity: .2; } }

/* ---------- 풍선 연출 ---------- */
.celebrate .plant svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.celebrate.deflate .plant .b-anim { transform-origin: 50% 30%; animation: deflate 1.6s .3s cubic-bezier(.5, 0, .75, 0) forwards; }
@keyframes deflate { 35% { transform: scale(.92, .82) rotate(-8deg); } 100% { transform: translateY(110px) scale(.5, .3) rotate(-28deg); opacity: .6; } }


.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.week.row-wide { justify-content: space-between; padding: 8px 14px; background: var(--tag-bg); border: 1px solid var(--line); border-radius: 14px; }
.week.row-wide ol { gap: 6px; }
.week.row-wide li { width: 26px; font-size: 12px; }
.week.row-wide b { font-size: 13px; }

/* ---------- 60 / 30 / 10 ---------- */
/* 10%: 코랄은 화면마다 핵심 행동 하나와 '비행' 풍선, 새 소식 점에만 */
.btn.cta, .btn.bloom, .send.cta { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.cta:hover, .btn.bloom:hover, .send.cta:hover { background: var(--accent); filter: brightness(1.05); }
.btn.cta:active, .send.cta:active { transform: scale(.98); }
.b-btn[data-stage="5"] .b-tag { background: var(--accent); color: var(--on-accent); font-weight: 800; }
.house-btn .dot, .me-btn .dot, .bar i, .hbar .track2 i.bloomy, .track div[data-bloom][data-on]::before, .timeline [data-k="comment"] i { background: var(--accent); }
.tabs .badge { background: var(--accent); color: var(--on-accent); }
.points-chip i { background: var(--bloom-soft); box-shadow: inset 0 0 0 2.5px var(--accent); }
.push .app-ic { background: var(--soil); }
/* 30%: 네이비는 글자와 기본 행동 */
.write-date { margin: 0; font-size: 28px; line-height: 1.15; }
/* 글자: 제목은 굵은 Gothic A1을 좁게, 본문은 IBM Plex Sans KR */
h1, h2, .display, .topbar h1, .hero h1, .sheet h2, .write-date, .sec-title { font-family: var(--font-display); font-weight: 800; letter-spacing: -.025em; }
.hero h1 { font-size: 34px; line-height: 1.2; letter-spacing: -.035em; }
.b-tag, .b-row b, .label-pill, .saved b, .wordmark, .menu-item b { font-weight: 700; letter-spacing: -.01em; }
/* 하늘 위에 뜬 카드: 이번 주 기록 */
.week.row-wide { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 10px 16px; box-shadow: var(--card-shadow); }
.week.row-wide b { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.03em; }
.week.row-wide li[data-today] i { box-shadow: 0 0 0 3px var(--bloom-soft); }
.b-tag { box-shadow: 0 6px 14px -10px rgba(20, 33, 61, .6); }
/* 안내 패널의 색 비율 */
.ratio { display: flex; height: 56px; border: 1.5px solid var(--soil); border-radius: 12px; overflow: hidden; }
.ratio i { display: flex; align-items: flex-end; padding: 6px 8px; font-style: normal; }
.ratio b { font-size: 13px; font-weight: 700; }
.swatches { list-style: none; margin: 12px 0 14px; padding: 0; display: grid; gap: 8px; }
.swatches li { display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; align-items: center; }
.swatches span { grid-row: span 2; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); }
.swatches b { font-size: 14px; font-weight: 600; }
.swatches small { font-size: 12.5px; color: var(--soil-faint); }
/* 새 소식은 크림 카드 + 코랄 점 하나로 (면 전체를 코랄로 칠하지 않아요) */
.notice-banner { background: var(--paper); color: var(--soil); border: 1px solid var(--line); box-shadow: var(--card-shadow); justify-content: flex-start; }
.notice-banner::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.notice-banner span { margin-left: auto; color: var(--soil); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .celebrate .old { opacity: 0; } .celebrate .new { opacity: 1; }
  .celebrate.wither .plant .foliage { opacity: 0; animation: none; }
  .celebrate .later { opacity: 1; animation: none; }
  .petal-rain, .dust { display: none; }
  .b-btn.grew, .b-btn.pop-in, .enter-up, .enter-down, .celebrate.deflate .b-anim { animation: none !important; }

  .wave i { transform: scaleY(.6); }
}

</div>

<script>
/* =====================================================================
   아이디어 정원 · 풍선 버전 베타 프로토타입
   서버·LLM 없이 화면 흐름을 보여 주는 용도입니다. 정원 신선의 질문은 각본입니다.
   ===================================================================== */
(function () {
"use strict";

/* ---------- 유틸 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 86400000;
const now = () => Date.now();
const dkey = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const fmtDate = (t) => { const d = new Date(t); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
const fmtDateTime = (t) => { const d = new Date(t); return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

const NAME_IDEAS = { lib: ["빈자리알림", "빈자리지도"], class: ["강의실온도"], team: ["팀플시간표", "회의맞추기"], printer: ["프린터대기"], share: ["건물공구"] };
const NAME_STOP = new Set(["너무", "정말", "매번", "항상", "자꾸", "그냥", "진짜", "더", "잘", "다", "것", "거", "수", "때", "등", "및", "있으면", "좋겠다", "있는", "없는", "하는", "같은"]);
function labelFrom(text) {
  const words = String(text).replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean)
    .map((w) => w.replace(/(에서|으로|마다|이랑|하고|까지|부터|처럼|보다|은|는|이|가|을|를|에|의|로|도|만|과|와|랑)$/, ""))
    .filter((w) => w.length >= 2 && !NAME_STOP.has(w) && !/(다|요|고|서|면|게|지|며|는데)$/.test(w));
  let out = "";
  for (const w of words) { if ((out + w).length > 7) { if (!out) out = w.slice(0, 7); break; } out += w; if (out.length >= 5) break; }
  return out || String(text).replace(/\s+/g, "").slice(0, 6);
}
function suggestLabel(i, keys) {
  const used = new Set(i.names.map((n) => n.name));
  const pre = (NAME_IDEAS[i.id] || []).find((n) => !used.has(n));
  if (pre && keys.length) return pre;
  const k = keys[keys.length - 1];
  if (k) { const s = labelFrom(i.answers[k]); if (s && !used.has(s)) return s; }
  return i.label;
}
function setLabel(i, name) {
  name = name.trim().slice(0, 7);
  if (!name || name === i.label) return false;
  i.label = name; i.names.push({ name, at: now() });
  return true;
}
function guessCategory(text) {
  if (/(배달|식재료|밥|학식|음식|요리|카페)/.test(text)) return "food";
  if (/(강의|수업|시험|공부|과제|교재|수강)/.test(text)) return "education";
  if (/(팀플|일정|시간표|회의|메모|정리)/.test(text)) return "productivity";
  if (/(택배|이웃|자취|동네|원룸)/.test(text)) return "local";
  if (/(버스|셔틀|킥보드|자전거|통학)/.test(text)) return "mobility";
  return "campus";
}

const SLOTS = [[180, 112], [96, 146], [264, 146], [180, 228], [42, 214], [318, 214], [104, 46], [256, 46], [32, 104], [328, 104], [180, 30]];
function skyScene(list, { house = true, ground = [], lift = 0, action = "balloon", label = "내 풍선들" } = {}) {
  const W = 360, H = 420;
  const sorted = [...list].sort((a, b) => b.stage - a.stage || b.createdAt - a.createdAt);
  const shown = sorted.slice(0, SLOTS.length);
  const hy = 300 - lift; // 집 꼭대기 y
  const ax = 180, ay = hy + 13;
  const items = shown.map((x, k) => { const [cx, cy] = SLOTS[k]; const r = STAGE_SIZE[x.stage - 1] / 2; return { x, cx, cy, r }; });
  const strings = house ? items.map(({ cx, cy, r }) => { const by = cy + r * (64 / 60) * 0.98; return `<path d="M${cx} ${by.toFixed(1)} Q ${(cx + (ax - cx) * 0.25).toFixed(1)} ${((by + ay) / 2 + 12).toFixed(1)} ${ax} ${ay}" stroke="var(--string)" stroke-width="1.2" fill="none"/>`; }).join("") : "";
  const deflated = ground.slice(0, 4).map((g, k) => `<g transform="translate(${[38, 74, 286, 318][k]} ${384 + (k % 2) * 4}) scale(.42)">${balloon(g.stage, DOWN, { deflated: true }).replace(/<svg[^>]*>|<\/svg>/g, "")}</g>`).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
    <defs><radialGradient id="dusk" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color:var(--glow)" stop-opacity=".42"/><stop offset=".55" style="stop-color:var(--glow)" stop-opacity=".12"/><stop offset="1" style="stop-color:var(--glow)" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="180" cy="392" rx="180" ry="150" fill="url(#dusk)"/>
    ${cloud(14, 262, 1.1, 0.75)}${cloud(268, 280, 1, 0.65)}${cloud(222, 4, 0.8, 0.5)}
    <path d="M0 392 C 70 376, 140 386, 180 390 C 230 394, 290 376, 360 388 L360 420 L0 420 Z" fill="var(--hill)"/>
    ${deflated}
    ${strings}
    ${house ? houseG(120, hy) : ""}
  </svg>`;
  const buttons = items.map(({ x, cx, cy, r }) => {
    const w = (2 * r) / W * 100, left = (cx - r) / W * 100, top = (cy - r) / H * 100;
    const cls = [S.justGrew === x.id ? "grew" : "", S.justSaved === x.id ? "pop-in" : ""].join(" ");
    return `<button class="b-btn ${cls}" style="left:${left.toFixed(2)}%;top:${top.toFixed(2)}%;width:${w.toFixed(2)}%" data-action="${action}" data-id="${x.id}" data-stage="${x.stage}" ${action === "balloon" ? "data-longpress" : ""} aria-label="${esc(x.label)}, ${stageText(x.stage)}, ${esc(x.title)}">${balloon(x.stage, bColor(x, x.stage))}<span class="b-tag">${esc(x.label)}</span></button>`;
  }).join("");
  const more = sorted.length > shown.length ? `<span class="more-note">+${sorted.length - shown.length}개는 아래 목록에</span>` : "";
  const groundBtn = ground.length ? `<button class="ground-btn" data-action="go" data-to="archive">땅에 내려앉은 풍선 ${ground.length}개</button>` : "";
  return `<div class="scene" role="group" aria-label="${label}">${svg}${buttons}${more}${groundBtn}</div>`;
}

/* ----- 2) 하늘 화면 ----- */

  const wide = isWide();

  return `
  <div class="view-inner" style="gap:14px">

      ${wide ? weekDots() : `<button class="to-write" data-action="toWrite">${ICON_DOWN}기록</button>`}
      <div class="hdr-right">${pointsChip()}<button class="house-btn" data-action="openMenu" aria-label="메뉴 열기: 커뮤니티, 아카이브, 내 정보${unreadCount() ? `, 새 알림 ${unreadCount()}개` : ""}">${ICON_HOUSE}${unreadCount() ? '<span class="dot"></span>' : ""}</button></div>
    </div>

    ${skyScene(active, { ground, lift: Math.min(5, flying) * 10 })}
    <p class="sky-hint">풍선을 누르면 정원 신선이 바로 질문을 시작해요. 길게 누르면 자세히 볼 수 있어요.</p>
    <section class="stack" style="gap:8px" aria-label="풍선 목록">

        <button class="icon-btn" data-action="peek" data-id="${i.id}" aria-label="${esc(i.label)} 자세히">${ICON_MORE}</button></li>`).join("")}</ul>

/* ----- 풍선 자세히 ----- */
SCREENS.seed = (r) => {
  const i = idea(r.id); if (!i) return SCREENS.sky({});
  const tab = r.tab || "grow";
  const next = i.stage + 1;
  const ru = RUBRIC[next];
  const sleeping = asleep(i);
  return `
  <div class="view-inner">
    <div class="topbar"><div class="left">${backTo(sleeping ? "archive" : "sky")}</div><span class="chip ${i.visibility === "private" ? "plain" : ""}">${{ private: "비공개", community: "내 커뮤니티 공개", all: "전체 공개" }[i.visibility]}</span></div>
    ${sleeping ? `<div class="notice stack" style="gap:8px"><b>땅에 내려앉은 풍선이에요</b><span>${esc(sleepReason(i))}</span><div class="row"><button class="btn primary small" data-action="wake" data-id="${i.id}">바람 넣기</button>${i.shared ? `<span class="chip">커뮤니티에 나누는 중</span>` : `<button class="btn quiet small" data-action="openShare" data-id="${i.id}">풍선 줄 건네기</button>`}</div></div>` : ""}
    <section class="idea-hero" style="grid-template-columns:96px 1fr"><div style="width:${40 + i.stage * 11}px;justify-self:center">${balloon(i.stage, sleeping ? DOWN : bColor(i, i.stage), { string: true })}</div>
      <div class="stack" style="gap:6px"><div class="row" style="gap:6px"><span class="label-pill ${i.stage === 5 ? "flying" : ""}">${esc(i.label)}</span><button class="link-btn" data-action="openRename" data-id="${i.id}">이름표 고치기</button></div><h1>${esc(i.title)}</h1><p class="meta">${stageText(i.stage)} · 처음 기록 ${fmtDateTime(i.createdAt)}</p></div></section>
    <div class="track" aria-label="성장 단계">${STAGES.map((s) => `<div ${s.n <= i.stage ? "data-on" : ""} ${s.n === next && !sleeping ? "data-now" : ""} ${s.n === 5 ? "data-bloom" : ""}>${s.name}</div>`).join("")}</div>
    <section class="stack" style="gap:6px"><h2 class="sec-title">발전 과정 <small>기록 → 대화 → 첨삭 → 이름표 → 성장</small></h2>${timeline(i)}</section>
    <div class="tabs" role="tablist">${[["grow", "키우기"], ["log", `발전 기록 ${i.log.length}`], ["share", "공유·팀"]].map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-action="tab" data-id="${i.id}" data-tab="${k}">${l}</button>`).join("")}</div>
    ${tab === "grow" ? seedGrow(i, ru, next, sleeping) : tab === "log" ? seedLog(i) : seedShare(i)}
  </div>`;
};
function timelineEvents(i) {
  const ev = [];
  ev.push({ t: i.createdAt, k: "plant", l: i.via === "voice" ? "음성 기록" : "기록" });
  i.names.slice(1).forEach((n) => ev.push({ t: n.at, k: "name", l: `‘${n.name}’` }));
  i.log.forEach((e) => {
    if (e.kind === "comment") ev.push({ t: e.at, k: "comment", l: "첨삭 반영" });
    else if (e.kind === "archive") ev.push({ t: e.at, k: "rest", l: "내려앉음" });
    else if (e.kind === "wake") ev.push({ t: e.at, k: "plant", l: "바람 넣기" });
    else if (e.kind === "share") ev.push({ t: e.at, k: "comment", l: "줄 건넴" });
    else ev.push({ t: e.at, k: "talk", l: "대화" });
  });
  Object.entries(i.stageAt || {}).forEach(([n, t]) => ev.push({ t, k: "stage", l: `${n}단계` }));
  return ev.sort((a, b) => a.t - b.t);
}
function timeline(i) {
  return `<ol class="timeline" aria-label="발전 과정">${timelineEvents(i).map((e) => { const d = new Date(e.t); return `<li data-k="${e.k}"><i></i><b>${esc(e.l)}</b><span>${d.getMonth() + 1}/${d.getDate()}</span></li>`; }).join("")}</ol>`;
}
function seedGrow(i, ru, next, sleeping) {
  const body = `<p class="muted" style="font-size:14px;white-space:pre-line">${esc(i.body)}</p>`;
  const received = receivedBlock(i);
  const archiveLink = sleeping ? "" : `<button class="link-btn" data-action="openArchive" data-id="${i.id}" style="align-self:center;color:var(--soil-faint);margin-top:4px">더 키우기 어렵다면 땅에 내려놓기</button>`;
  if (i.stage === 5) {
    return `${body}
      <div class="panel stack" style="border-color:var(--bloom)">
        <b class="display" style="font-size:19px">날 준비가 된 풍선이에요</b>
        <p class="muted" style="font-size:14px">발전 기록, 대화, 반영한 첨삭으로 기획서를 만들 수 있어요.</p>
        <button class="btn bloom full" data-action="go" data-to="plan" data-id="${i.id}">${i.plan ? "기획서 보기" : "기획서 만들기"}</button>
        <button class="btn quiet full" data-action="tab" data-id="${i.id}" data-tab="share">공유하고 팀 찾기</button>
      </div>${received}${archiveLink}`;
  }
  const filled = ru.items.filter((it) => i.answers[it.k]).length;
  return `${body}
    <section class="panel stack">
      <h2 class="sec-title">다음: ${stageText(next)} <small>${ru.title} · ${filled}/${ru.items.length}</small></h2>
      <ul class="checklist">${ru.items.map((it) => `<li><span class="check" ${i.answers[it.k] ? "data-ok" : ""}>${i.answers[it.k] ? CHECK : ""}</span><div><b>${it.label}</b><p>${i.answers[it.k] ? esc(snip(i.answers[it.k], 60)) : "아직 이야기하지 않았어요"}</p></div></li>`).join("")}</ul>
      <div class="divider"></div>
      ${sleeping ? `<p class="faint">바람을 넣으면 정원 신선과 이어서 이야기할 수 있어요.</p>` : `
      <div class="quota"><span>이 단계 무료 질문 ${i.freeLeft}/${S.settings.freePerStage}${i.paidLeft ? ` · 추가 질문 ${i.paidLeft}개` : ""}</span><span class="dots" aria-hidden="true">${Array.from({ length: S.settings.freePerStage }, (_, k) => `<i ${k >= i.freeLeft ? "data-used" : ""}></i>`).join("")}</span></div>
      <button class="btn primary full" data-action="go" data-to="chat" data-id="${i.id}">정원 신선과 이야기하기</button>`}
    </section>${received}${archiveLink}`;
}
function receivedBlock(i) {
  const list = commentsOn(i.id).sort((a, b) => b.at - a.at);
  pendingSeen.push(...list.filter((c) => !c.seen));
  return `<section class="stack" style="gap:2px"><h2 class="sec-title">받은 첨삭 <small>${list.length ? `${list.length}개 중 ${list.filter((c) => c.adopted).length}개 반영` : "아직 없어요"}</small></h2>
    ${list.length ? `<div class="clist">${list.map((c) => commentItem(c, { adopt: true })).join("")}</div>` : `<p class="faint">${i.visibility === "private" ? "커뮤니티에 공개하면 다른 사람의 첨삭을 받을 수 있어요." : "첨삭이 오면 여기에 모여요."}</p>`}</section>`;

function seedLog(i) {

  return `<div class="log">${names}${[...i.log].reverse().map((e) => {
    if (e.kind === "comment") return `<article class="log-entry" style="border-color:var(--bloom)"><h3>${fmtDateTime(e.at)} · ${esc(e.name)}님의 첨삭 반영</h3><dl><dt>${esc(e.type)}</dt><dd>${esc(e.text)}</dd></dl></article>`;
    if (e.kind === "archive") return `<article class="log-entry" style="border-color:var(--line)"><h3>${fmtDateTime(e.at)} · 땅에 내려놓음</h3>${e.reason ? `<dl><dt>왜 멈췄나</dt><dd>${esc(e.reason)}</dd></dl>` : ""}</article>`;

    if (e.kind === "share") return `<article class="log-entry" style="border-color:var(--bloom)"><h3>${fmtDateTime(e.at)} · 커뮤니티에 풍선 줄을 건넴</h3></article>`;
    return `<article class="log-entry">
      <h3>${fmtDateTime(e.at)} · ${stageText(e.stage)}</h3>

        <dt>오늘 나온 결론</dt><dd>${e.conclusions.length ? `<ul>${e.conclusions.map(([l, a]) => `<li><b style="font-weight:500">${esc(l)}</b>: ${esc(a)}</li>`).join("")}</ul>` : "새로 정해진 내용은 없어요"}</dd>
        <dt>아직 남은 질문</dt><dd>${e.open.length ? e.open.map(esc).join(", ") : "없음"}</dd>

        ${[["private", "비공개", "나만 볼 수 있어요"], ["community", "내 커뮤니티 공개", `${S.user.uni}${S.user.clubs.length ? ", " + S.user.clubs.join(", ") : ""}`], ["all", "전체 공개", "베타에 참여한 모든 학교"]].map(([k, l, h]) => `

  return `
  <div class="chat-view">
    <div class="chat-head">
      <div class="topbar"><div class="left">${backTo("sky", "하늘로 돌아가기")}<div style="min-width:0"><span class="label-pill" style="font-size:14px;padding:2px 10px">${esc(i.label)}</span><span class="faint" style="display:block;margin-top:2px">${ru ? `${stageText(next)}까지 · ${ru.title} ${filled}/${ru.items.length}` : stageText(i.stage)}</span></div></div>

    </div>
    <div class="chat-body" aria-live="polite">${i.chat.map((m) => msgHtml(m, i)).join("")}</div>
    <div class="chat-foot">
      ${pendItem ? `<div class="row" style="justify-content:space-between"><span class="faint">말로 답하거나 적어 주세요</span><button class="link-btn" data-action="hint" data-id="${i.id}">${demoFor(i, pending.k) ? "예시 답변 넣기" : "답변 예시 보기"}</button></div>` : ""}
      <form class="composer with-mic" data-form="chat" data-id="${i.id}">
        <button type="button" class="mic" data-action="voice" data-target="chat" aria-label="말로 답하기">${ICON_MIC}</button>
        <textarea class="textarea" id="chat-input" name="msg" rows="1" placeholder="${pendItem ? "생각나는 대로 답해 주세요" : "신선에게 할 말을 적어 주세요"}" aria-label="답변">${esc(S.draft["chat-" + i.id] || "")}</textarea>
        <button class="send cta" type="submit" aria-label="보내기"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </form>
      <button class="btn quiet full" data-action="endSession" data-id="${i.id}">오늘은 여기까지</button>
    </div>
  </div>`;
};
function msgHtml(m, i) {
  if (m.role === "me") return `<div class="msg me">${m.via === "voice" ? `<span class="faint" style="display:block;font-size:11px;color:inherit;opacity:.8">말로 답함</span>` : ""}${esc(m.text)}</div>`;
  if (m.role === "note") return `<div class="msg note">${esc(m.text)}</div>`;
  if (m.role === "typing") return `<div class="typing" aria-label="신선이 생각 중"><i></i><i></i><i></i></div>`;
  if (m.role === "judge") {
    const ok = m.results.every((x) => x.ok);
    return `<div class="judge"><h3>${stageText(m.to)} 판정</h3>
      <ul class="checklist">${m.results.map((x) => `<li><span class="check" ${x.ok ? "data-ok" : ""}>${x.ok ? CHECK : ""}</span><div><b>${esc(x.label)}</b><p>${x.ok ? "충분해요" : "아직 비어 있어요"}</p></div></li>`).join("")}</ul>
      ${ok && i.stage + 1 === m.to ? `<button class="btn ${m.to === 5 ? "bloom" : "primary"} full" data-action="stageUp" data-id="${i.id}">${m.to === 5 ? "풍선 띄우기" : "풍선 키우기"}</button>` : ok ? `<p class="faint">이미 이 단계로 자랐어요.</p>` : ""}</div>`;
  }
  return `<div class="msg sage"><span class="who">${SAGE_ICON}정원 신선</span>${m.pre ? esc(m.pre) : ""}${m.q ? `<span class="q">${esc(m.q)}</span>` : ""}${m.after ? `<span style="display:block;margin-top:6px">${esc(m.after)}</span>` : ""}</div>`;
}

const TICKER = [

let online = 27;
function presence() {
  return `<section class="presence" aria-label="지금 하늘에 있는 사람">

function tickTicker() {
  tickIdx++;
