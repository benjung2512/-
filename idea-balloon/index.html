/* ---------- 계산 ---------- */
function weekCount() {
  const ws = weekStart(now());
  let n = 0;
  for (let d = 0; d < 7; d++) if (S.activity[dkey(ws + d * DAY)]) n++;
  return n;
}
function markActivity() {
  const k = dkey(now());
  S.activity[k] = (S.activity[k] || 0) + 1;
  const ws = weekStart(now());
  if (weekCount() >= S.settings.weeklyTarget && !S.goalAwarded[ws]) {
    S.goalAwarded[ws] = true;
    addTx(S.settings.weeklyGoal, "주간 목표 달성");
    setTimeout(() => { toast(`이번 주 목표를 채웠어요. +${S.settings.weeklyGoal}P`); chime("reward"); }, 900);
  }
}
const lastTouched = (i) => Math.max(i.createdAt, i.wokenAt || 0, ...i.log.filter((e) => e.kind !== "archive").map((e) => e.at), ...Object.values(i.stageAt || {}), ...(i.chat.length ? [i.chat[i.chat.length - 1].at || 0] : [0]));
const asleep = (i) => !!i.archived || (i.stage < 5 && now() - lastTouched(i) > SLEEP_DAYS * DAY);
const rewardedToday = () => S.comments.filter((c) => c.authorId === "me" && c.rewarded && dkey(c.at) === dkey(now())).length;

/* ---------- 정원 신선 엔진 (각본) ---------- */
function ensureChatStarted(i) {
  if (i.chat.length && i.session) return;
  i.session = { newKeys: [], startedAt: now() };
  const ru = RUBRIC[i.stage + 1];
  if (!ru) { if (!i.chat.length) i.chat.push({ role: "sage", pre: "날 준비가 된 풍선이에요. 이제 기획서로 정리할 차례예요.", at: now() }); return; }
  const first = ru.items.find((it) => !i.answers[it.k]);
  i.chat.push({ role: "note", text: `${fmtDateTime(now())} · ‘${i.label}’ · ${stageText(i.stage)}`, at: now() });
  const fresh = commentsOn(i.id).filter((c) => c.adopted && !c.mentioned);
  fresh.forEach((c) => (c.mentioned = true));
  const mention = fresh.length ? ` ${fresh[0].author}님 첨삭도 함께 생각해 봐요. 「${snip(fresh[0].text, 30)}」` : "";
  if (i.pending && !i.pending.unpaid) {
    const it = ru.items.find((x) => x.k === i.pending.k);
    if (it && !i.answers[it.k]) { i.chat.push({ role: "sage", pre: `지난번 질문부터 이어 갈게요.${mention}\n`, q: it.q, at: now() }); save(); return; }
    i.pending = null;
  }
  if (!first) { i.chat.push({ role: "sage", pre: `${ru.title}에 필요한 이야기는 모두 모였어요.`, after: "위의 '다음 단계로'를 눌러 판정을 받아 보세요.", at: now() }); save(); return; }
  const opener = (i.log.length ? OPEN[1] : OPEN[0]).replace("%s", ru.title) + mention;
  askItem(i, first, opener);
  save();
}
function credit(i) { if (i.freeLeft > 0) { i.freeLeft--; return true; } if (i.paidLeft > 0) { i.paidLeft--; return true; } return false; }
function askItem(i, it, pre) {
  if (!credit(i)) {
    i.pending = { k: it.k, followed: false, unpaid: true };
    i.chat.push({ role: "note", text: "이 단계의 무료 질문을 모두 썼어요.", at: now() });
    setTimeout(() => openPay(i), 300);
    return;
  }
  i.pending = { k: it.k, followed: false };
  i.chat.push({ role: "sage", pre: pre ? pre + "\n" : "", q: it.q, at: now() });
}
function nextUnanswered(i) { const ru = RUBRIC[i.stage + 1]; return ru ? ru.items.find((it) => !i.answers[it.k]) : null; }
function onAnswer(i, text, via) {
  i.chat.push({ role: "me", text, at: now(), via });
  const ru = RUBRIC[i.stage + 1];
  const it = i.pending && ru ? ru.items.find((x) => x.k === i.pending.k) : null;
  if (!it) { i.chat.push({ role: "sage", pre: "말씀 고마워요.", after: "필요한 질문은 다 드렸어요. '다음 단계로'로 판정을 받아 보시겠어요?", at: now() }); return; }
  const vague = text.trim().length < 14 || VAGUE.test(text);
  if (vague && !i.pending.followed) {
    if (!credit(i)) { i.answers[it.k] = text.trim(); i.session.newKeys.push(it.k); i.pending = null; i.chat.push({ role: "note", text: "무료 질문을 다 써서 이 답을 그대로 적어 둘게요.", at: now() }); setTimeout(() => openPay(i), 300); return; }
    i.pending.followed = true;
    i.chat.push({ role: "sage", pre: "", q: it.f, at: now() });
    return;
  }
  i.answers[it.k] = text.trim();
  if (!i.session.newKeys.includes(it.k)) i.session.newKeys.push(it.k);
  i.pending = null;
  // 말로 길게 답하면 한 줄로 되짚고 넘어갑니다
  const ack = via === "voice" && text.length > 30
    ? `이렇게 이해했어요: 「${snip(text, 28)}」 맞나요? 다르면 고쳐서 다시 말씀해 주세요.`
    : ACK[Math.floor(Math.random() * ACK.length)].replace("%s", snip(text, 20));
  const nx = nextUnanswered(i);
  if (nx) askItem(i, nx, ack);
  else { i.chat.push({ role: "sage", pre: ack, after: `${ru.title}에 필요한 이야기가 모두 모였어요. 판정을 해 볼까요?`, at: now() }); judge(i); }
}
function judge(i) {
  const to = i.stage + 1; const ru = RUBRIC[to]; if (!ru) return;
  const results = ru.items.map((it) => ({ label: it.label, ok: !!i.answers[it.k] }));
  i.chat.push({ role: "judge", to, results, at: now() });
  const miss = results.filter((x) => !x.ok);
  if (miss.length) {
    const nx = nextUnanswered(i);
    const pre = `아직 ${miss.map((m) => `'${m.label}'`).join(", ")}이(가) 비어 있어요. 이것부터 이야기해 볼까요?`;
    if (nx && (!i.pending || i.pending.k !== nx.k)) askItem(i, nx, pre);
    else i.chat.push({ role: "sage", pre, after: "위 질문에 답해 주시면 돼요.", at: now() });
  }
}
function stageUp(i) {
  const from = i.stage;
  i.stage++;
  i.stageAt = { ...(i.stageAt || {}), [i.stage]: now() };
  i.freeLeft = S.settings.freePerStage; i.paidLeft = 0; i.pending = null;
  addTx(S.settings.stageUp, `단계 상승 · ${i.title} ${STAGES[i.stage - 1].name}`);
  const keys = i.session ? [...i.session.newKeys] : [];
  finishSession(i, true);
  i.session = { newKeys: keys, startedAt: now() };
  i.chat.push({ role: "note", text: `풍선이 커졌어요 · ${stageText(i.stage)} · +${S.settings.stageUp}P`, at: now() });
  if (i.stage < 5) { const nx = nextUnanswered(i); if (nx) askItem(i, nx, `이제 '${RUBRIC[i.stage + 1].title}' 차례예요.`); }
  else i.chat.push({ role: "sage", pre: "풍선이 날 준비가 됐어요. 여기까지 오는 아이디어는 많지 않아요.", after: "이제 기획서로 정리하고, 원하면 공유해서 함께할 사람을 찾아보세요.", at: now() });
  S.justGrew = i.id;
  save();
  chime(i.stage === 5 ? "bloom" : "stage");
  celebrate(from, i);
}
function finishSession(i, silent) {
  if (!i.session) return null;
  const keys = i.session.newKeys;
  const items = Object.values(RUBRIC).flatMap((r) => r.items);
  const entry = {
    at: now(), stage: silent ? i.stage - 1 : i.stage,
    conclusions: keys.map((k) => { const it = items.find((x) => x.k === k); return [it.label, snip(i.answers[k], 48)]; }),
    organized: keys.length,
    open: silent ? [] : (RUBRIC[i.stage + 1]?.items.filter((it) => !i.answers[it.k]).map((it) => it.label) || []),
  };
  const touched = keys.length || i.chat.some((m) => m.role === "me" && m.at >= i.session.startedAt);
  i.session = null;
  if (!touched) return null;
  entry.keys = keys;
  i.log.push(entry);
  markActivity();
  return entry;
}

/* ---------- 기획서 ---------- */
function makePlan(i) {
  const a = i.answers;
  const L = (s) => s || "(아직 정리되지 않았어요)";
  const team = i.seeking.length ? i.seeking.map((s) => SKILLS[s]).join(", ") : "아직 정하지 않았어요";
  const adopted = commentsOn(i.id).filter((c) => c.adopted);
  const plan = [
    { h: "문제 정의", b: `${L(a.who)}이(가)\n${L(a.when)}\n이 순간 겪는 불편: ${L(a.pain)}` },
    { h: "타깃 사용자", b: `처음 쓸 사람: ${L(a.target)}\n지금의 대안: ${L(a.alt)}` },
    { h: "해결책과 핵심 기능", b: `${L(a.solution)}\n핵심 기능: ${L(a.features)}` },
    { h: "차별점", b: `기존 대안의 한계: ${L(a.gap)}\n우리가 다른 점: ${L(a.diff)}` },
    { h: "검증 계획", b: `${L(a.validate)}\n성공 기준: ${L(a.metric)}` },
    { h: "비즈니스 모델", b: L(a.bm) },
  ];
  if (adopted.length) plan.push({ h: "첨삭으로 함께 다듬은 점", b: adopted.map((c) => `${c.author} (${c.type}): ${snip(c.text, 60)}`).join("\n") });
  plan.push({ h: "필요한 팀 역량", b: `${team}\n현재 팀: ${[S.user.name, ...i.team.map((p) => person(p).name)].join(", ")}` });
  return plan;
}
function planMarkdown(i) { return `# ${i.title} (‘${i.label}’)\n\n> ${S.user.name} · ${S.user.uni} · 처음 기록 ${fmtDateTime(i.createdAt)}\n\n` + i.plan.map((s) => `## ${s.h}\n\n${s.b}`).join("\n\n") + "\n"; }
function sageSummaryDraft(i) { const a = i.answers; if (a.solution) return snip(`${a.target ? snip(a.target, 18) + "을 위한 " : ""}${a.solution}`, 110); if (a.pain) return snip(`${a.who ? snip(a.who, 20) + "의 " : ""}불편: ${a.pain}`, 110); return snip(i.body, 110); }

/* ---------- 공유 · 피드 ---------- */
function mineAsFeed() {
  return S.ideas.filter((i) => i.shared || (!asleep(i) && i.visibility !== "private" && i.published)).map((i) => ({ id: i.id, label: i.label, title: i.title, summary: i.summary || sageSummaryDraft(i), author: S.user.name, uni: S.user.uni, community: true, stage: i.stage, category: i.category, likes: i.likes, createdAt: i.createdAt, seeking: i.seeking, funding: i.funding, mine: true, shared: !!i.shared }));
}
const allFeed = () => [...mineAsFeed(), ...S.feed];
function feedItems() { return allFeed().filter((x) => S.feedTab === "all" || x.community); }
function sameCommunity(p) { return p.uni === S.user.uni || p.clubs.some((c) => S.user.clubs.includes(c)); }
function recommend(i) {
  return S.people.filter((p) => !i.team.includes(p.id)).map((p) => ({ p, s: p.skills.filter((s) => i.seeking.includes(s)).length * 2 + (sameCommunity(p) ? 1 : 0) })).filter((x) => x.s >= 2).sort((a, b) => b.s - a.s).map((x) => x.p);
}

/* ---------- 연출 ---------- */

function newIdea(o) { return mkIdea({ id: uid(), stage: 1, freeLeft: S.settings.freePerStage, ...o }); }
const FORMS = {
  signup: (f) => {
    const name = f.name.value.trim(), email = f.email.value.trim().toLowerCase(), pw = f.pw.value;
    const err = $("#su-error");
    const m = matchUni(email);
    const msg = !name ? "이름을 입력해 주세요." : !m ? "베타 참여 대학의 학교 이메일로만 가입할 수 있어요. 예: you@hanbit.test" : pw.length < 8 ? "비밀번호는 8자 이상으로 정해 주세요." : "";
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    S.user = { ...S.user, name, email, uni: m.name, clubs: [] };
    S.draft.signup = { name, email };
    go("verify");
  },
  capture: (f) => {
    const text = f.text.value.trim();
    if (!text) { toast("한 줄이라도 적어 주세요. 마이크로 말해도 돼요."); f.text.focus(); return; }
    const via = S.draft.captureVia || "text";
    const label = (via === "voice" && S.draft.captureLabel) || labelFrom(text);
    const i = newIdea({ label, title: snip(text, 26).replace(/…$/, "").trim(), body: text, createdAt: now(), via, category: guessCategory(text) });
    S.ideas.push(i);
    S.draft.capture = ""; S.draft.captureVia = null; S.draft.captureLabel = null;
    S.lastSaved = i.id; S.justSaved = i.id;
    markActivity(); save();
    pendingFocus = "capture";
    render();
    chime("memo");
  },
  rename: (f) => {
    const i = idea(f.dataset.id); if (!i) return;
    const v = f.name.value.trim();
    if ([...v].length < 2) { toast("이름표는 2자 이상으로 지어 주세요."); f.name.focus(); return; }
    const changed = setLabel(i, v);
    save(); closeSheet();
    if (f.dataset.after) { S.justGrew = i.id; go(f.dataset.after); toast(changed ? `이름표를 ‘${i.label}’로 바꿨어요. 이전 이름은 기록에 남았어요.` : "오늘 이야기를 저장했어요."); }
    else { render(); toast(changed ? `이름표를 ‘${i.label}’로 바꿨어요.` : "그대로 두었어요."); }
  },
  chat: (f) => {
    const i = idea(f.dataset.id); const text = f.msg.value.trim(); if (!text) return;
    if (i.pending && i.pending.unpaid) { openPay(i); return; }
    const via = S.draft.chatVia || "text";
    S.draft["chat-" + i.id] = ""; S.draft.chatVia = null;
    f.msg.value = "";
    i.chat.push({ role: "me", text, at: now(), via });
    i.chat.push({ role: "typing", at: now() });
    render();
    setTimeout(() => {
      i.chat = i.chat.filter((m) => m.role !== "typing");
      i.chat.pop();
      onAnswer(i, text, via); save(); render();
    }, 700);
  },
  comment: (f) => {
    const id = f.dataset.id; const text = f.text.value.trim();
    const type = (f.querySelector('input[name="ctype"]:checked') || {}).value || COMMENT_TYPES[1];
    if (text.length < 20) { toast(`첨삭은 20자 이상 적어 주세요. 지금 ${text.length}자예요.`); f.text.focus(); return; }
    const x = allFeed().find((y) => y.id === id); if (!x || x.mine) return;
    const st = S.settings;
    const c = { id: uid(), ideaId: id, authorId: "me", author: S.user.name, type, text, at: now(), adopted: false, rewarded: false };
    if (rewardedToday() < st.commentDailyCap) { c.rewarded = true; addTx(st.commentReward, `첨삭 · ${x.title}`); }
    S.comments.push(c);
    S.draft["cm-" + id] = ""; S.draft.ctype = type;
    save(); render();
    toast(c.rewarded ? `첨삭을 남겼어요. +${st.commentReward}P` : "첨삭을 남겼어요. 오늘 리워드 한도에 닿아 포인트는 없어요.");
    chime("reward");
    if (!S.simAdopted[id]) {
      S.simAdopted[id] = true; save();
      setTimeout(() => {
        c.adopted = true; addTx(st.adoptBonus, `첨삭 반영 · ${x.title}`); save(); render();
        toast(`${x.author}님이 내 첨삭을 반영했어요. +${st.adoptBonus}P`); chime("reward");
      }, 6000);
    }
  },
  archive: (f) => { const i = idea(f.dataset.id); const why = f.why.value.trim(); closeSheet(); deflate(i, why); },
  share: (f) => {
    const i = idea(f.dataset.id); const sum = f.sum.value.trim();
    i.shared = true; i.sharedAt = now(); i.summary = sum || sageSummaryDraft(i); i.visibility = "all";
    i.log.push({ at: now(), stage: i.stage, kind: "share" });
    save(); closeSheet(); render();
    toast("풍선 줄을 건넸어요. 커뮤니티의 팀 구성 탭에도 보여요.");
  },
  req: (f) => {
    const id = f.dataset.id, kind = f.dataset.kind;
    S.sentRequests[id] = { ...(S.sentRequests[id] || {}), [kind]: "pending" };
    save(); closeSheet(); render(); toast(kind === "team" ? "팀 참여 신청을 보냈어요." : "열람 요청을 보냈어요.");
  },
  fund: (f) => {
    const i = idea(f.dataset.id); const st = S.settings;
    const goal = +(document.querySelector('input[name="goal"]:checked') || { value: 500 }).value;
    if (balance() < st.fundingFee) return;
    addTx(-st.fundingFee, `펀딩 등록 · ${i.title}`);
    i.funding = { goal, raised: 0, backers: 0, endsAt: now() + 14 * DAY };
    save(); closeSheet(); render(); toast("펀딩을 등록했어요.");
  },
};

  const el = ev.target.closest("[data-action]");
  if (!el) return;
  if (lpFired && el.hasAttribute("data-longpress")) { lpFired = false; ev.preventDefault(); return; }
  const fn = A[el.dataset.action];
  if (!fn) return;
  ev.preventDefault();
  fn({ ...el.dataset }, ev);
});
// 길게 누르기: 풍선 자세히
let lpTimer = null, lpStart = null;
document.addEventListener("pointerdown", (ev) => {
  const b = ev.target.closest("[data-longpress]"); if (!b) return;
  lpFired = false; lpStart = { x: ev.clientX, y: ev.clientY };
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { lpFired = true; openPeek(b.dataset.id); try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} }, 480);
});
document.addEventListener("pointermove", (ev) => { if (lpStart && Math.hypot(ev.clientX - lpStart.x, ev.clientY - lpStart.y) > 10) { clearTimeout(lpTimer); lpStart = null; } });
["pointerup", "pointercancel"].forEach((t) => document.addEventListener(t, () => { clearTimeout(lpTimer); lpStart = null; }));
document.addEventListener("contextmenu", (ev) => { if (ev.target.closest("[data-longpress]")) ev.preventDefault(); });
// 위로 쓸어 올리기(기록 → 하늘) · 아래로 쓸어 내리기(하늘 → 기록)
let sw = null;
view.addEventListener("touchstart", (ev) => {
  if (ev.touches.length !== 1) { sw = null; return; }
  const t = ev.touches[0];
  sw = { x: t.clientX, y: t.clientY, t: Date.now(), inText: !!ev.target.closest("textarea, input"), top: view.scrollTop <= 0, bottom: view.scrollTop + view.clientHeight >= view.scrollHeight - 2 };
}, { passive: true });
view.addEventListener("touchend", (ev) => {
  if (!sw || isWide()) { sw = null; return; }
  const t = ev.changedTouches[0]; const dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  const quick = Date.now() - sw.t < 700 && Math.abs(dy) > 70 && Math.abs(dx) < 60;
  const name = S.route.name;
  if (quick && name === "write" && dy < 0 && !sw.inText && sw.bottom) A.toSky();
  else if (quick && name === "sky" && dy > 0 && sw.top) A.toWrite();
  sw = null;
}, { passive: true });
// 빈 메모장을 두 번 누르면 하늘로 (보조 단축키)
document.addEventListener("dblclick", (ev) => { if (ev.target.id === "capture" && !ev.target.value.trim() && !isWide()) A.toSky(); });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { closeSheet(); closeOverlays(); }
  const el = ev.target.closest && ev.target.closest('[role="button"][data-action]');
  if (el && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); el.click(); }
  if (ev.target.id === "chat-input" && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); ev.target.form.requestSubmit(); }
  if (ev.target.id === "capture" && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); ev.target.form.requestSubmit(); }
});
document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("[data-form]"); if (!f) return;
  ev.preventDefault(); FORMS[f.dataset.form](f);
});
document.addEventListener("change", (ev) => { if (ev.target.name === "ctype") S.draft.ctype = ev.target.value; });
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.live === "signupEmail") {
    S.draft.signup = { ...(S.draft.signup || {}), email: t.value };
    const m = matchUni(t.value); const typed = t.value.includes("@") && (t.value.split("@")[1] || "").includes(".");
    const h = $("#su-email-hint");
    h.textContent = typed ? (m ? `${m.name} 커뮤니티에 자동으로 소속돼요.` : "베타 참여 대학의 학교 이메일만 가입할 수 있어요.") : "예: you@hanbit.test, you@saesol.test";
    h.style.color = typed ? (m ? "var(--leaf-deep)" : "var(--danger)") : "";
  }
  if (t.dataset.live === "onbCode") { (S.draft.onb ||= { interests: [], skills: [] }).code = t.value; }
  if (t.dataset.live === "summary") { const i = idea(t.dataset.id); i.summary = t.value; save(); }
  if (t.dataset.live === "comment") { S.draft["cm-" + t.dataset.id] = t.value; const c = $("#cm-count"); if (c) c.textContent = `${t.value.trim().length}자 · 20자 이상`; }
  if (t.id === "capture") { S.draft.capture = t.value; if (!t.value) { S.draft.captureVia = null; S.draft.captureLabel = null; } }
  if (t.id === "rn-input") { const c = $("#rn-count"); if (c) c.textContent = `${[...t.value].length}/7자 · 바꾸면 이전 이름은 발전 기록에 남아요`; }
  if (t.id === "chat-input") { const i = idea(S.route.id); if (i) S.draft["chat-" + i.id] = t.value; t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; }
  if (t.dataset.plan) { const i = idea(t.dataset.plan); i.plan[+t.dataset.k].b = t.innerText; save(); }
  if (t.dataset.setting) { const v = Math.max(1, Math.min(999, parseInt(t.value || "0", 10) || 1)); S.settings[t.dataset.setting] = v; save(); }
});

function applyHash() { document.body.classList.toggle("with-guide", location.hash === "#guide"); }
applyHash();
window.addEventListener("hashchange", () => { applyHash(); render(); });
if (wideMQ.addEventListener) wideMQ.addEventListener("change", () => render()); else if (wideMQ.addListener) wideMQ.addListener(() => render());
// 앱을 열면 바로 기록 화면
if (S.signedIn && !FULL_ROUTES.has(S.route.name)) { S.route = { name: "write" }; pendingFocus = "capture"; }
render(true);
setInterval(tickTicker, 4500);
})();
</script>
</body>
